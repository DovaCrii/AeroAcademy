name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Instalar dependencias
        run: uv sync

      - name: Lint (ruff)
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Revisión de Django y migraciones
        run: |
          uv run python manage.py check
          uv run python manage.py makemigrations --check --dry-run

      - name: Semillas válidas
        run: uv run python manage.py seed_catalog --dry-run
        continue-on-error: false

      - name: Pruebas
        run: uv run pytest
