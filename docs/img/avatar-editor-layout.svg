<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" font-family="Archivo, system-ui, sans-serif" font-size="12" role="img" aria-label="Esquema del editor de avatar propuesto, escritorio y 375 px">
  <title>Editor de avatar propuesto: escritorio y 375 px</title>
  <rect width="1000" height="620" fill="#FAF8F3"/>
  <g stroke="#ECE6DA" stroke-width="1">
    <path d="M0 40H1000M0 80H1000M0 120H1000M0 160H1000M0 200H1000M0 240H1000M0 280H1000M0 320H1000M0 360H1000M0 400H1000M0 440H1000M0 480H1000M0 520H1000M0 560H1000M0 600H1000"/>
  </g>
  <text x="20" y="28" font-size="18" font-weight="800" fill="#1B1F27">Escritorio (≥ 900 px)</text>

  <!-- columna izquierda pegajosa -->
  <rect x="20" y="44" width="300" height="540" rx="10" fill="#FFFFFF" stroke="#1B1F27" stroke-width="2"/>
  <text x="34" y="66" font-weight="700" fill="#4A5663">STICKY · top: 72px</text>
  <rect x="70" y="78" width="200" height="200" fill="#0F2A4D" stroke="#8B5CF6" stroke-width="4"/>
  <text x="170" y="182" text-anchor="middle" fill="#F4EBD8">escenario 40×40 a 5× = 200 px</text>
  <rect x="226" y="82" width="40" height="18" rx="3" fill="#FFC21A"/><text x="246" y="95" text-anchor="middle" font-weight="800" fill="#1B1F27">NV 7</text>
  <text x="34" y="300" fill="#1B1F27">Zoom: <tspan font-weight="700">( 3× )  (• 5× )  ( 6× )</tspan>   Pose: [de pie] [saluda] [trabaja]</text>
  <text x="34" y="324" font-weight="800" font-size="15" fill="#1B1F27">Geomensor/a</text>
  <text x="34" y="342" fill="#4A5663">Oficio · Topografía · CAP +2  ANA +1</text>
  <text x="34" y="362" fill="#4A5663">▸ Lo que lleva (leyenda: casco = «Primer Trofeo»…)</text>
  <rect x="34" y="380" width="272" height="2" fill="#ECE6DA"/>
  <rect x="34" y="396" width="130" height="36" rx="6" fill="#1B1F27"/><text x="99" y="419" text-anchor="middle" fill="#FFFFFF" font-weight="700">Guardar</text>
  <rect x="176" y="396" width="130" height="36" rx="6" fill="#FFFFFF" stroke="#1B1F27"/><text x="241" y="419" text-anchor="middle" fill="#1B1F27">Cancelar</text>
  <rect x="34" y="442" width="130" height="32" rx="6" fill="#FFFFFF" stroke="#8D9CAD"/><text x="99" y="463" text-anchor="middle" fill="#1B1F27">🎲 Sorpréndeme</text>
  <rect x="176" y="442" width="130" height="32" rx="6" fill="#FFFFFF" stroke="#8D9CAD"/><text x="241" y="463" text-anchor="middle" fill="#1B1F27">Restablecer</text>
  <text x="34" y="500" fill="#7A2A2A">• Cambios sin guardar (solo si hay cambios)</text>

  <!-- columna derecha: acordeón -->
  <g fill="#FFFFFF" stroke="#1B1F27" stroke-width="1.5">
    <rect x="340" y="44" width="640" height="34" rx="6"/>
    <rect x="340" y="84" width="640" height="300" rx="6"/>
    <rect x="340" y="390" width="640" height="34" rx="6"/>
    <rect x="340" y="430" width="640" height="34" rx="6"/>
    <rect x="340" y="470" width="640" height="34" rx="6"/>
    <rect x="340" y="510" width="640" height="34" rx="6"/>
  </g>
  <text x="354" y="66" fill="#1B1F27"><tspan font-weight="800">▸ 1 Carrera</tspan>  ·  Geomensor/a</text>
  <text x="354" y="106" fill="#1B1F27"><tspan font-weight="800">▾ 2 Cuerpo y cara</tspan>  ·  Neutro, piel Clara, ojos Puntos</text>
  <text x="354" y="132" fill="#4A5663" font-weight="700">CUERPO</text>
  <g fill="#F4EBD8" stroke="#8D9CAD"><rect x="354" y="140" width="48" height="48"/><rect x="408" y="140" width="48" height="48"/><rect x="462" y="140" width="48" height="48" stroke="#1E8CFF" stroke-width="3"/></g>
  <text x="354" y="214" fill="#4A5663" font-weight="700">PIEL</text>
  <g stroke="#1B1F27"><rect x="354" y="222" width="24" height="24" fill="#FBDDC4"/><rect x="384" y="222" width="24" height="24" fill="#F2C9A0" stroke="#1E8CFF" stroke-width="3"/><rect x="414" y="222" width="24" height="24" fill="#E0A87A"/><rect x="444" y="222" width="24" height="24" fill="#C68642"/><rect x="474" y="222" width="24" height="24" fill="#B97B52"/><rect x="504" y="222" width="24" height="24" fill="#8D5524"/><rect x="534" y="222" width="24" height="24" fill="#6F4426"/><rect x="564" y="222" width="24" height="24" fill="#4A2C1A"/></g>
  <text x="354" y="272" fill="#4A5663" font-weight="700">OJOS  <tspan font-weight="400">(recorte de la zona de ojos a 4×)</tspan></text>
  <g fill="#F4EBD8" stroke="#8D9CAD"><rect x="354" y="280" width="48" height="24"/><rect x="408" y="280" width="48" height="24"/><rect x="462" y="280" width="48" height="24"/><rect x="516" y="280" width="48" height="24"/><rect x="570" y="280" width="48" height="24"/></g>
  <rect x="402" y="310" width="60" height="20" rx="4" fill="#1B1F27"/><text x="432" y="324" text-anchor="middle" fill="#FFFFFF">Con iris</text>
  <text x="470" y="324" fill="#4A5663">← nombre en hover / foco (tooltip)</text>
  <circle cx="401" cy="283" r="3" fill="#C9A24A"/><text x="630" y="296" fill="#4A5663">• punto ámbar = recomendado por tu carrera</text>
  <text x="354" y="360" fill="#4A5663">Color de ojos · Cejas · Boca (mismo patrón)</text>
  <text x="354" y="412" fill="#1B1F27"><tspan font-weight="800">▸ 3 Pelo</tspan>  ·  Jopo, Castaño, sin barba</text>
  <text x="354" y="452" fill="#1B1F27"><tspan font-weight="800">▸ 4 Ropa</tspan>  ·  Chaqueta de topógrafo, Naranja</text>
  <text x="354" y="492" fill="#1B1F27"><tspan font-weight="800">▸ 5 Casco y herramientas</tspan>  ·  Legionario, Jalón con prisma</text>
  <text x="354" y="532" fill="#1B1F27"><tspan font-weight="800">▸ 6 Fondo y marco</tspan>  ·  Curvas de nivel, Común</text>
  <text x="340" y="572" fill="#4A5663">&lt;details name="av-sec"&gt;: uno abierto a la vez, sin JS. El resumen muestra la elección actual.</text>

  <!-- móvil -->
  <text x="20" y="610" font-size="11" fill="#4A5663">En 375 px: la vista previa queda como franja pegajosa arriba (96 px + nombre); Guardar/Cancelar en barra pegajosa abajo; secciones en una columna.</text>
</svg>
