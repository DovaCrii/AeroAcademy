<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="t d"><title id="t">Dibujo a mano: tres superficies de la Tierra, el terreno real, el geoide (nivel del mar prolongado) y el elipsoide matemático achatado</title><desc id="d">Corte de la Tierra, exagerado. El elipsoide es una forma matemática lisa; el geoide sigue la gravedad y ondula respecto de él; el terreno sube y baja sobre el geoide. Se indican el semieje mayor y el achatamiento de WGS 84.</desc><g stroke-linecap="round" stroke-linejoin="round"><path d="M34.5 142L35.9 129.5L35.8 115.1L37.9 99.9L44.6 86.6L55.5 76.7L68.7 70.2L82.5 65.9L96.5 63.3L108.9 51.6L124 45.3L139.7 47L153.6 55.6L164.8 67.4L174.2 79L183.1 89L191.7 98.3L203.9 104.7L212.2 115.1L216.9 127.5L220.5 140.2L212.7 142.2L207.4 131.5L202.3 120.8L195.4 111.2L186 104L175.5 98.8L165.6 93.9L156.7 87L147.6 78L136.7 69.4L124 64.6L110.8 65.5L98.6 71.1L87.7 78.3L77.3 85.1L66.7 91.4L56.9 98.9L49.6 108.9L45.7 120.8L44.2 133L42.2 144.1Z" fill="#8AC926" fill-opacity="0.85"/><path d="M227.1 166C230 174.7 232.9 186.1 230.4 194.5C227.8 202.9 218.5 210.5 211.7 216.6C204.9 222.8 196.6 226.9 189.5 231.5C182.4 236 176.4 241.7 169.1 244.1C161.8 246.5 152.9 245.8 145.4 245.8C137.9 245.9 131.4 243.4 124 244.6C116.6 245.7 109.1 251.4 100.7 252.8C92.4 254.2 81.7 255.6 73.8 252.9C65.9 250.2 59.7 242.6 53.5 236.5C47.2 230.5 41.1 223.9 36.3 216.6C31.5 209.3 25.5 201.1 24.6 192.6C23.7 184.2 28.1 174.1 31.1 166C34 157.9 39.8 151.6 42.2 144.1C44.6 136.6 43.3 128.3 45.7 120.8C48.2 113.3 51.6 104.8 56.9 98.9C62.1 92.9 70.3 89.7 77.3 85.1C84.2 80.4 90.8 74.5 98.6 71.1C106.3 67.6 115.8 63.4 124 64.6C132.2 65.7 140.6 73.1 147.6 78C154.5 82.9 159.2 89.6 165.6 93.9C172 98.2 179.9 99.5 186 104C192.1 108.5 197.8 114.4 202.3 120.8C206.7 127.2 208.6 134.7 212.7 142.2C216.9 149.8 224.1 157.3 227.1 166Z" fill="#4CC9F0" fill-opacity="0.4" stroke="#1B7FA3" stroke-width="2.6"/><path d="M34.5 142C34.7 139.9 35.7 134 35.9 129.5C36.2 125 35.5 120 35.8 115.1C36.1