<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="t d"><title id="t">Dibujo a mano: tres cámaras ven los mismos puntos del terreno; esos puntos de amarre permiten calcular la pose de cada cámara y un punto de control ancla el bloque al sistema de coordenadas</title><desc id="d">La aerotriangulación ajusta todas las fotos a la vez. Cada cámara tiene una pose, que es su posición X, Y, Z más tres giros. Los puntos de amarre son detalles vistos en varias fotos; un punto de control con coordenadas conocidas ancla el bloque. Con GNSS o GNSS más sensor inercial se necesitan menos puntos de control.</desc><g stroke-linecap="round" stroke-linejoin="round"><path d="M14 182L70 172L130 178L190 168L250 176L310 170L386 180L386 196L14 196Z" fill="#8AC926" fill-opacity="0.45"/><path d="M56 70Q70 70 84 70Q83.9 78 84 86Q70 85.5 56 86Q56.3 78 56 70Z" fill="#FFC93C" stroke="#1F2430" stroke-width="2"/><path d="M70 85.2C72.8 85.2 74.9 87.2 74.9 90C74.9 92.8 72.8 95.2 70 95.2C67.2 95.2 65 92.8 65 90C65 87.2 67.2 85.2 70 85.2Z" fill="#2EC4B6" stroke="#1F2430" stroke-width="1.8"/><path d="M186 62Q200 61.7 214 62Q214.3 70 214 78Q200 78 186 78Q185.7 70 186 62Z" fill="#FFC93C" stroke="#1F2430" stroke-width="2"/><path d="M200 76.9C202.8 76.9 205 79.2 205 82C205 84.8 202.8 87.1 200 87.1C197.2 87.1 195.1 84.8 195.1 82C195.1 79.2 197.2 76.9 200 76.9Z" fill="#2EC4B6" stroke="#1F2430" stroke-width="1.8"/><path d="M316 70Q330 69.4 344 70Q344.4 78 344 86Q330 86.3 316 86Q316 78 316 70Z" fill="#FFC93C" stroke="#1F2430" stroke-width="2"/><path d="M330 85.1C332.8 85.1 335.1 87.2 335.1 90C335.1 92.8 332.8 95.2 330 95.2C327.2 95.2 325 92.8 325 90C325 87.2 327.2 85.1 330 85.1Z" fill="#2EC4B6" stroke="#1F2430" stroke-width="1.8"/><path d="M14 182C23.3 180.3 50.7 172.7 70 172C89.3 171.3 110 178.7 130 178C150 177.3 170 168.3 190 168C210 167.7 230 175.7 250 176C270 176.3 287.3 169.3 310 170C332.7 170.7 373.3 178.3 386 180" fill="none" stroke="#1F2430" stroke-width="2.4"/><