oke="#1F2430" stroke-width="2.4"/></g><g stroke="none" fill="#1F2430" font-family="Archivo, 'Segoe UI', system-ui, sans-serif"><text x="16" y="24" font-size="15" font-weight="700">Estación total: ángulos y distancia</text><text x="16" y="58" font-size="12" font-weight="700">Perfil</text><text x="262" y="58" font-size="12" font-weight="700">Planta</text><text x="82" y="72" font-size="11" font-weight="600" fill="#C75A0E">ángulo vertical</text><text x="118" y="138" font-size="11" font-weight="600" fill="#C0293A"><tspan x="118">distancia</tspan><tspan x="118" dy="13.4">inclinada</tspan></text><text x="33" y="172" font-size="11" font-weight="700">ai</text><text x="244" y="188" font-size="11" font-weight="700">ap</text><text x="74" y="240" font-size="11" font-weight="600" text-anchor="middle">A (conocido)</text><text x="212" y="240" font-size="11" font-weight="600" text-anchor="middle">B (prisma)</text><text x="212" y="77" font-size="11" font-weight="600" text-anchor="middle">Prisma</text><text x="338" y="160" font-size="12" font-weight="700" fill="#C75A0E">Hz</text><text x="292" y="176" font-size="12" font-weight="700" text-anchor="end">A</text><text x="350" y="102" font-size="12" font-weight="700">R</text><text x="374" y="202" font-size="12" font-weight="700" text-anchor="end">B</text><text x="262" y="206" font-size="11" fill="#5A6475">R: referencia</text><text x="262" y="222" font-size="11" fill="#5A6475">d: dist. horizontal</text><text x="262" y="240" font-size="11" font-weight="600">E₂ = E₁ + d·sen Az</text><text x="262" y="254" font-size="11" font-weight="600">N₂ = N₁ + d·cos Az</text><text x="16" y="262" font-size="11" font-weight="600">Z₂ = Z₁ + ai + Δz − ap</text><text x="16" y="276" font-size="11" fill="#5A6475">ai: instrumento · ap: prisma</text><text x="200" y="292" font-size="11" font-weight="600" text-anchor="middle">Típico: ángulo 1″ a 5″, distancia a mm</text></g></svg>