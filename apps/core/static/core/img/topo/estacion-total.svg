<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="t d"><title id="t">Dibujo a mano: estación total sobre un trípode midiendo el ángulo vertical, el ángulo horizontal y la distancia hasta un prisma en un jalón, con vista de perfil y de planta</title><desc id="d">Perfil: el instrumento sobre el punto A con altura de instrumento ai mide el ángulo vertical y la distancia inclinada al prisma del punto B con altura ap. Planta: el ángulo horizontal Hz se mide desde un punto de referencia R. Con eso se calculan E, N y cota de B.</desc><g stroke-linecap="round" stroke-linejoin="round"><path d="M16 224Q131 223.1 246 224" fill="none" stroke="#1F2430" stroke-width="2.2"/><path d="M74 152Q59.5 187.8 46 224" fill="none" stroke="#1F2430" stroke-width="3"/><path d="M74 152Q87.7 188.1 102 224" fill="none" stroke="#1F2430" stroke-width="3"/><path d="M74 152Q72.9 188 74 224" fill="none" stroke="#1F2430" stroke-width="2.4"/><path d="M59 134Q74 133.7 89 134Q89.2 143 89 152Q74 151.6 59 152Q59.1 143 59 134Z" fill="#cfd3da" fill-opacity="0.9" stroke="#1F2430" stroke-width="2.4"/><path d="M61 100Q74 99.7 87 100Q86.7 117 87 134Q74 134.1 61 134Q61.5 117 61 100Z" fill="#E63946" fill-opacity="0.9" stroke="#1F2430" stroke-width="2.4"/><path d="M87 108Q95 107.7 103 108Q103.1 112.5 103 117Q95 116.7 87 117Q86.9 112.5 87 108Z" fill="#2EC4B6" stroke="#1F2430" stroke-width="2.4"/><path d="M74 110.9C77.3 110.9 80.1 113.7 80.1 117C80.1 120.3 77.3 123.1 74 123.1C70.7 123.1 67.8 120.3 67.8 117C67.8 113.7 70.7 110.9 74 110.9Z" fill="#FFC93C" stroke="#1F2430" stroke-width="1.8"/><path d="M67 224Q74 224 81 224Q77.6 218.9 74 214Q70.7 219.1 67 224Z" fill="#1F2430" stroke="#1F2430" stroke-width="2.4"/><path d="M212 108Q211.6 166 212 224" fill="none" stroke="#1F2430" stroke-width="3.4"/><path d="M199 84Q212 83.5 225 84Q225.2 96 225 108Q212 108.5 199 108Q198.6 96 199 84Z" fill="#2EC4B6" fill-opacity="0.9" stroke="#1F2430" stroke-width="2.4"/><path d="M212 91.2C214.8 91.2 21