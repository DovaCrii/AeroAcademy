<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="t d"><title id="t">Dibujo a mano: altura elipsoidal h que mide el GNSS, ondulación del geoide N y altura ortométrica H sobre el nivel del mar, con h = H + N</title><desc id="d">Perfil con el elipsoide abajo, el geoide ondulado en el medio y un cerro con un receptor GNSS en la cima. h se mide desde el elipsoide, H desde el geoide y N es la separación entre ambos. Se muestra un ejemplo numérico redondo.</desc><g stroke-linecap="round" stroke-linejoin="round"><path d="M16 198L40 200.5L64 202.6L88 203.8L112 203.9L136 202.9L160 201L184 198.5L208 195.9L232 193.8L256 192.4L280 192L304 192.8L328 194.6L352 197L376 199.6L384 200.4L384 240L16 240Z" fill="#4CC9F0" fill-opacity="0.28"/><path d="M16 198L80 188L140 160L200 124L252 104L300 122L350 160L384 198.4L384 200.4L376 199.6L352 197L328 194.6L304 192.8L280 192L256 192.4L232 193.8L208 195.9L184 198.5L160 201L136 202.9L112 203.9L88 203.8L64 202.6L40 200.5L16 198Z" fill="#8AC926" fill-opacity="0.8"/><path d="M16 198C20 198.4 32 199.8 40 200.5C48 201.3 56 202.1 64 202.6C72 203.1 80 203.6 88 203.8C96 204 104 204.1 112 203.9C120 203.8 128 203.4 136 202.9C144 202.4 152 201.7 160 201C168 200.3 176 199.4 184 198.5C192 197.7 200 196.7 208 195.9C216 195.2 224 194.4 232 193.8C240 193.2 248 192.7 256 192.4C264 192.1 272 191.9 280 192C288 192.1 296 192.4 304 192.8C312 193.2 320 193.9 328 194.6C336 195.3 344 196.1 352 197C360 197.8 370.7 199 376 199.6C381.3 200.1 382.7 200.2 384 200.4" fill="none" stroke="#1B7FA3" stroke-width="3"/><path d="M16 240.6C20 240.7 32 241.2 40 241.4C48 241.7 56 241.9 64 242.2C72 242.4 80 242.5 88 242.7C96 242.8 104 242.9 112 243C120 243 128 243 136 243C144 242.9 152 242.9 160 242.7C168 242.6 176 242.4 184 242.2C192 242 200 241.8 208 241.5C216 241.3 224 241 232 240.7C240 240.4 248 240.1 256 239.8C264 239.5 272 239.2 280 238.9C288 238.7 296 238.4 304 238.2C312 237.9 320 237.7 328 237.5C336 237.4 344 237.2 352 237.1C360 237.1 370.7 237 376 237C381.3 237 382.7 237 384 237" fill="none" stroke="#1F2430" stroke-width="2.4" stroke-dasharray="8 6"/><path d="M16 198C26.7 196.3 59.3 194.3 80 188C100.7 181.7 120 170.7 140 160C160 149.3 181.3 133.3 200 124C218.7 114.7 235.3 104.3 252 104C268.7 103.7 283.7 112.7 300 122C316.3 131.3 336 147.3 350 160C364 172.7 378.3 192 384 198.4" fill="none" stroke="#1F2430" stroke-width="2.6"/><path d="M252 104Q252 93 252 82" fill="none" stroke="#1F2430" stroke-width="3"/><path d="M252 68.1C256.4 68.1 260.1 71.6 260.1 76C260.1 80.4 256.4 83.8 252 83.8C247.6 83.8 243.7 80.4 243.7 76C243.7 71.6 247.6 68.1 252 68.1Z" fill="#FFC93C" stroke="#1F2430" stroke-width="2.4"/><path d="M214 241.3Q213.7 172.7 214 104" fill="none" stroke="#C0293A" stroke-width="2.6"/><path d="M217.4 110.1L214 104L210.6 110.1" fill="none" stroke="#C0293A" stroke-width="2.6"/><path d="M210.6 235.2L214 241.3L217.4 235.2" fill="none" stroke="#C0293A" stroke-width="2.6"/><path d="M280 192Q279.5 152 280 112" fill="none" stroke="#C75A0E" stroke-width="2.6"/><path d="M283.4 118.1L280 112L276.6 118.1" fill="none" stroke="#C75A0E" stroke-width="2.6"/><path d="M276.6 185.9L280 192L283.4 185.9" fill="none" stroke="#C75A0E" stroke-width="2.6"/><path d="M338 237.3Q338.6 216.4 338 195.5" fill="none" stroke="#12786F" stroke-width="2.6"/><path d="M341.4 201.6L338 195.5L334.6 201.6" fill="none" stroke="#12786F" stroke-width="2.6"/><path d="M334.6 231.2L338 237.3L341.4 231.2" fill="none" stroke="#12786F" stroke-width="2.6"/><path d="M214 104Q233 104.4 252 104" fill="none" stroke="#1F2430" stroke-width="1.4" stroke-dasharray="3 4"/></g><g stroke="none" fill="#1F2430" font-family="Archivo, 'Segoe UI', system-ui, sans-serif"><text x="16" y="24" font-size="15" font-weight="700">Tres alturas distintas</text><text x="16" y="46" font-size="12" font-weight="800" fill="#C0293A">h</text><text x="30" y="46" font-size="11">altura elipsoidal: la mide el GNSS</text><text x="16" y="60" font-size="12" font-weight="800" fill="#C75A0E">H</text><text x="30" y="60" font-size="11">altura ortométrica: cota sobre el mar</text><text x="16" y="74" font-size="12" font-weight="800" fill="#12786F">N</text><text x="30" y="74" font-size="11">ondulación del geoide: sale de un modelo</text><text x="206" y="168" font-size="15" font-weight="800" text-anchor="end" fill="#C0293A">h</text><text x="288" y="148" font-size="15" font-weight="800" fill="#C75A0E">H</text><text x="346" y="224" font-size="15" font-weight="800" fill="#12786F">N</text><text x="16" y="216" font-size="11" font-weight="600">Geoide: H = 0, nivel del mar</text><text x="16" y="258" font-size="11" font-weight="600">Elipsoide: h = 0 (modelo matemático)</text><text x="200" y="277" font-size="14" font-weight="700" text-anchor="middle">h = H + N      →      H = h − N</text><text x="200" y="291" font-size="11" text-anchor="middle" fill="#5A6475">Ejemplo redondo: h = 560 m, N = 25 m → H = 535 m</text></g></svg>