<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="t d"><title id="t">Dibujo a mano: comparación de cuatro métodos GNSS, estático, RTK, PPK y autónomo, con el tiempo, el modo de corrección y la precisión típica de cada uno</title><desc id="d">Cuatro filas. Estático: horas en el punto y postproceso, precisión de milímetros a centímetros, para puntos de control. RTK: tiempo real con base propia o red NTRIP, centímetros. PPK: se corrige después, centímetros, útil en drones sin radio. Autónomo: un receptor sin correcciones, metros.</desc><g stroke-linecap="round" stroke-linejoin="round"><path d="M16 54Q200 54.1 384 54Q383.3 80 384 106Q200 104.9 16 106Q15.5 80 16 54Z" fill="#2EC4B6" fill-opacity="0.22" stroke="#1F2430" stroke-width="2"/><path d="M22 62Q62 62.6 102 62Q101.8 73 102 84Q62 83.6 22 84Q21.6 73 22 62Z" fill="#2EC4B6" fill-opacity="0.95" stroke="#1F2430" stroke-width="2"/><path d="M16 112Q200 110.9 384 112Q384.3 138 384 164Q200 163.4 16 164Q15.4 138 16 112Z" fill="#FFC93C" fill-opacity="0.22" stroke="#1F2430" stroke-width="2"/><path d="M22 120Q62 120 102 120Q102.2 131 102 142Q62 141.2 22 142Q22.5 131 22 120Z" fill="#FFC93C" fill-opacity="0.95" stroke="#1F2430" stroke-width="2"/><path d="M16 170Q200 169.8 384 170Q382.8 196 384 222Q200 223.1 16 222Q16.8 196 16 170Z" fill="#FF8C42" fill-opacity="0.22" stroke="#1F2430" stroke-width="2"/><path d="M22 178Q62 178.9 102 178Q102.4 189 102 200Q62 199.5 22 200Q22.1 189 22 178Z" fill="#FF8C42" fill-opacity="0.95" stroke="#1F2430" stroke-width="2"/><path d="M16 228Q200 229.1 384 228Q384.7 254 384 280Q200 279.9 16 280Q16.9 254 16 228Z" fill="#4CC9F0" fill-opacity="0.22" stroke="#1F2430" stroke-width="2"/><path d="M22 236Q62 236.3 102 236Q102.2 247 102 258Q62 259 22 258Q22.5 247 22 236Z" fill="#4CC9F0" fill-opacity="0.95" stroke="#1F2430" stroke-width="2"/></g><g stroke="none" fill="#1F2430" font-family="Archivo, 'Segoe UI', system-ui, sans-serif"><text x="16" y="24" font-size="15" font-weight="700">Métodos GNSS: qué esperar</text><text x="16" y="40" font-size="11.5" fill="#5A6475">Precisión típica, a cielo abierto</text><text x="62" y="78" font-size="12" font-weight="700" text-anchor="middle">Estático</text><text x="112" y="74" font-size="11"><tspan x="112">horas en el punto,</tspan><tspan x="112" dy="13.4">cálculo después</tspan></text><text x="378" y="76" font-size="15" font-weight="800" text-anchor="end">mm a cm</text><text x="378" y="94" font-size="11" text-anchor="end" fill="#5A6475">puntos de control</text><text x="62" y="136" font-size="12" font-weight="700" text-anchor="middle">RTK</text><text x="112" y="132" font-size="11"><tspan x="112">tiempo real, con base</tspan><tspan x="112" dy="13.4">o red (NTRIP)</tspan></text><text x="378" y="134" font-size="15" font-weight="800" text-anchor="end">cm</text><text x="378" y="152" font-size="11" text-anchor="end" fill="#5A6475">levantar, replantear</text><text x="62" y="194" font-size="12" font-weight="700" text-anchor="middle">PPK</text><text x="112" y="190" font-size="11"><tspan x="112">se corrige después;</tspan><tspan x="112" dy="13.4">sin radio en vuelo</tspan></text><text x="378" y="192" font-size="15" font-weight="800" text-anchor="end">cm</text><text x="378" y="210" font-size="11" text-anchor="end" fill="#5A6475">drones</text><text x="62" y="252" font-size="12" font-weight="700" text-anchor="middle">Autónomo</text><text x="112" y="248" font-size="11"><tspan x="112">un receptor solo,</tspan><tspan x="112" dy="13.4">sin correcciones</tspan></text><text x="378" y="250" font-size="15" font-weight="800" text-anchor="end">metros</text><text x="378" y="268" font-size="11" text-anchor="end" fill="#5A6475">solo navegar</text><text x="200" y="292" font-size="11.5" font-weight="700" text-anchor="middle">Pide siempre solución Fixed, no Float.</text></g></svg>