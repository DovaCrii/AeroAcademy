<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="t d"><title id="t">Dibujo a mano: perfil con árboles y un edificio; el MDS pasa por las copas y techos, el MDT sigue solo el suelo, y la diferencia entre ambos es la altura de lo construido o plantado; pulsos LiDAR bajan entre las hojas</title><desc id="d">El MDS es la superficie con copas y techos; el MDT es el suelo desnudo; MDE es el nombre general de ambos. Algunos pulsos LiDAR rebotan en la copa y otros llegan al suelo. La resta MDS menos MDT da la altura de árboles y edificios. Los volúmenes de tierra se calculan con el MDT.</desc><g stroke-linecap="round" stroke-linejoin="round"><path d="M14 206L17 205.6L20 205.1L23 204.7L26 204.3L29 203.9L32 203.5L35 203.1L38 202.8L41 202.4L44 202.1L47 201.8L50 201.5L53 201.2L56 201L59 200.7L62 200.5L65 200.4L68 200.2L71 200.1L74 200.1L77 200L80 200L83 200L86 200.1L89 200.1L92 200.2L95 200.4L98 200.5L101 200.7L104 201L107 201.2L110 201.5L113 201.8L116 202.1L119 202.4L122 202.8L125 203.1L128 203.5L131 203.9L134 204.3L137 204.7L140 205.2L143 205.6L146 206L149 206.4L152 206.9L155 207.3L158 207.7L161 208.1L164 208.5L167 208.9L170 209.3L173 209.6L176 209.9L179 210.2L182 210.5L185 210.8L188 211.1L191 211.3L194 211.5L197 211.6L200 211.8L203 211.9L206 211.9L209 212L212 212L215 212L218 211.9L221 211.9L224 211.8L227 211.6L230 211.5L233 211.3L236 211L239 210.8L242 210.5L245 210.2L248 209.9L251 209.6L254 209.2L257 208.9L260 208.5L263 208.1L266 207.7L269 207.3L272 206.8L275 206.4L278 206L281 205.6L284 205.1L287 204.7L290 204.3L293 203.9L296 203.5L299 203.1L302 202.7L305 202.4L308 202.1L311 201.7L314 201.5L317 201.2L320 200.9L323 200.7L326 200.5L329 200.4L332 200.2L335 200.1L338 200.1L341 200L344 200L347 200L350 200.1L353 200.1L356 200.2L359 200.4L362 200.6L365 200.7L368 201L371 201.2L374 201.5L377 201.8L380 202.1L383 202.4L386 202.8L386 222L14 222Z" fill="#FFC93C" fill-opacity="0.45"/><path d="M70 200.2Q69.9 188.1 70 176" fill="none" stroke="#1F2430