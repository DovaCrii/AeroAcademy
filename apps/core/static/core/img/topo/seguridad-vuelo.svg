tio; respetar el límite</text><text x="52" y="132" font-size="12.5" font-weight="700">Batería con reserva</text><text x="52" y="146" font-size="11">aterrizar con 30 % o más (el frío la baja)</text><text x="52" y="173" font-size="12.5" font-weight="700">Dos personas</text><text x="52" y="187" font-size="11">piloto y observador con vista al dron</text><text x="52" y="214" font-size="12.5" font-weight="700">Registrar el vuelo</text><text x="52" y="228" font-size="11">bitácora, ciclos de batería y video</text><text x="52" y="255" font-size="12.5" font-weight="700">Permisos y reglas</text><text x="52" y="269" font-size="11">DGAC y autorización de la zona</text><text x="200" y="292" font-size="11.5" font-weight="700" text-anchor="middle">Planifica el vuelo y vuela lo planificado.</text></g></svg>