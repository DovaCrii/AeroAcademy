<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="t d"><title id="t">Dibujo a mano: a la izquierda un dron fotografía el suelo con su huella y el tamaño de píxel GSD; a la derecha, en planta, fotos que se traslapan un 80 por ciento en la línea y un 60 por ciento entre líneas</title><desc id="d">Vista lateral: el GSD es el tamaño de un píxel proyectado en el suelo y se calcula con la altura, el tamaño de píxel del sensor y la distancia focal. Vista en planta: dos líneas de vuelo con fotos que se traslapan, frontal de 75 a 80 por ciento y lateral de 60 a 70 por ciento.</desc><g stroke-linecap="round" stroke-linejoin="round"><path d="M10 34Q103 33 196 34Q196.7 143 196 252Q103 252.5 10 252Q11 143 10 34Z" fill="#4CC9F0" fill-opacity="0.14" stroke="#1F2430" stroke-width="2"/><path d="M204 34Q297 34 390 34Q389.5 143 390 252Q297 253 204 252Q204 143 204 34Z" fill="#FFC93C" fill-opacity="0.16" stroke="#1F2430" stroke-width="2"/><path d="M93.7 73.8Q103 74.1 112.4 73.8Q112.3 78 112.4 82.2Q103 81.8 93.7 82.2Q93.8 78 93.7 73.8Z" fill="#FFC93C" stroke="#1F2430" stroke-width="2"/><path d="M93.7 76.3Q88.1 73.8 82.6 71.2" fill="none" stroke="#1F2430" stroke-width="2.2"/><path d="M74.9 68.7Q82.6 68.3 90.2 68.7" fill="none" stroke="#1F2430" stroke-width="2.2"/><path d="M112.3 76.3Q117.9 73.9 123.4 71.2" fill="none" stroke="#1F2430" stroke-width="2.2"/><path d="M115.8 68.7Q123.4 68.4 131.1 68.7" fill="none" stroke="#1F2430" stroke-width="2.2"/><path d="M99.6 82.2Q103 82.1 106.4 82.2Q106.3 84.8 106.4 87.3Q103 87.2 99.6 87.3Q99.7 84.8 99.6 82.2Z" fill="#2EC4B6" stroke="#1F2430" stroke-width="1.8"/><path d="M103 90Q73.6 140.5 46 192Q103 191.3 160 192Q130.6 141.5 103 90Z" fill="#4CC9F0" fill-opacity="0.3" stroke="#12786F" stroke-width="1.6" stroke-dasharray="5 4"/><path d="M16 192Q103 191.1 190 192" fill="none" stroke="#1F2430" stroke-width="2.4"/><path d="M24 192Q25.1 136 24 80" fill="none" stroke="#5A6475" stroke-width="1.8"/><path d="M26.4 84.4L24 80L21.6 84.4" fill="none" stroke="#5A6475" stroke-width="1.8"/><path d="M21.6 187.6L24 192L26.4 187.6" fill="none" stroke="#5A6475" stroke-width="1.8"/><path d="M46 204Q103 203.1 160 204" fill="none" stroke="#C0293A" stroke-width="1.8"/><path d="M155.6 206.4L160 204L155.6 201.6" fill="none" stroke="#C0293A" stroke-width="1.8"/><path d="M50.4 201.6L46 204L50.4 206.4" fill="none" stroke="#C0293A" stroke-width="1.8"/><path d="M98 185Q102 184.9 106 185Q106.2 188.5 106 192Q102 192.2 98 192Q97.8 188.5 98 185Z" fill="#FFC93C" stroke="#1F2430" stroke-width="1.6"/><path d="M106 186Q118.8 171.8 132 158" fill="none" stroke="#1F2430" stroke-width="1.2"/><path d="M218 70Q260 69.6 302 70Q302.2 99 302 128Q260 127.5 218 128Q217.6 99 218 70Z" fill="#4CC9F0" fill-opacity="0.3" stroke="#1F2430" stroke-width="1.6"/><path d="M235 70Q277 70.4 319 70Q318.7 99 319 128Q277 127.9 235 128Q235.1 99 235 70Z" fill="#4CC9F0" fill-opacity="0.3" stroke="#1F2430" stroke-width="1.6"/><path d="M218 93Q260 93.3 302 93Q301.9 122 302 151Q260 151.3 218 151Q217.8 122 218 93Z" fill="#FFC93C" fill-opacity="0.3" stroke="#1F2430" stroke-width="1.6"/><path d="M235 93Q277 92.7 319 93Q319.1 122 319 151Q277 150.4 235 151Q234.9 122 235 93Z" fill="#FFC93C" fill-opacity="0.3" stroke="#1F2430" stroke-width="1.6"/><path d="M214 62Q276 61 338 62" fill="none" stroke="#5A6475" stroke-width="1.4" stroke-dasharray="4 3"/><path d="M333.6 64.4L338 62L333.6 59.6" fill="none" stroke="#5A6475" stroke-width="1.4"/><path d="M218 158Q226.5 158 235 158" fill="none" stroke="#C75A0E" stroke-width="2.2"/><path d="M231.5 159.9L235 158L231.5 156.1" fill="none" stroke="#C75A0E" stroke-width="2.2"/><path d="M221.5 156.1L218 158L221.5 159.9" fill="none" stroke="#C75A0E" stroke-width="2.2"/><path d="M327 70Q326.6 81.5 327 93" fill="none" stroke="#12786F" stroke-width="2.2"/><path d="M325.1 89.5L327 93L328.9 89.5" fill="none" stroke="#12786F" stroke-width="2.2"/><path d="M328.9 73.5L327 70L325.1 73.5" fill="none" stroke="#12786F" stroke-width="2.2"/></g><g stroke="none" fill="#1F2430" font-family="Archivo, 'Segoe UI', system-ui, sans-serif"><text x="103" y="52" font-size="12" font-weight="700" text-anchor="middle">GSD: tamaño del píxel</text><text x="297" y="52" font-size="12" font-weight="700" text-anchor="middle">Traslape entre fotos</text><text x="30" y="140" font-size="13" font-weight="800">H</text><text x="103" y="220" font-size="11" font-weight="600" text-anchor="middle">huella de la foto</text><text x="134" y="164" font-size="11" font-weight="600" stroke="#FAF8F3" stroke-width="3" stroke-linejoin="round" paint-order="stroke"><tspan x="134">1 píxel</tspan><tspan x="134" dy="13.4">= GSD</tspan></text><text x="103" y="234" font-size="11.5" font-weight="700" text-anchor="middle">GSD = H × píxel ÷ focal</text><text x="346" y="66" font-size="11" fill="#5A6475">vuelo</text><text x="243" y="162" font-size="11" font-weight="600" fill="#C75A0E">avance 20 %</text><text x="297" y="186" font-size="11.5" font-weight="700" text-anchor="middle" fill="#C75A0E">frontal ≈ 75–80 %</text><text x="297" y="200" font-size="11" text-anchor="middle">(en la misma línea)</text><text x="297" y="220" font-size="11.5" font-weight="700" text-anchor="middle" fill="#12786F">lateral ≈ 60–70 %</text><text x="297" y="234" font-size="11" text-anchor="middle">(entre líneas)</text><text x="200" y="270" font-size="11" text-anchor="middle">Más altura: cubre más por foto, pero el GSD es más grueso.</text><text x="200" y="286" font-size="11" text-anchor="middle">Más traslape: más precisión, pero más vuelo y proceso.</text></g></svg>