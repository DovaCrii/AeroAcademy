<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="t d"><title id="t">Dibujo a mano: a la izquierda la fotogrametría mide de forma indirecta con dos fotos desde puntos distintos; a la derecha el LiDAR mide de forma directa con pulsos láser, con la fórmula de distancia c por t sobre 2</title><desc id="d">Fotogrametría: un mismo detalle visto en varias fotos tomadas desde puntos distintos se calcula en 3D por intersección; necesita luz y visibilidad. LiDAR: el pulso toca el objeto y vuelve; la distancia es la velocidad de la luz por el tiempo de ida y vuelta dividido por dos; funciona con poca luz y entre follaje porque hay varios retornos.</desc><g stroke-linecap="round" stroke-linejoin="round"><path d="M10 34Q103 35.1 196 34Q196.9 159 196 284Q103 285.1 10 284Q11.2 159 10 34Z" fill="#4CC9F0" fill-opacity="0.15" stroke="#1F2430" stroke-width="2"/><path d="M204 34Q297 33.2 390 34Q390.9 159 390 284Q297 283.6 204 284Q203.6 159 204 34Z" fill="#FF8C42" fill-opacity="0.15" stroke="#1F2430" stroke-width="2"/><path d="M47.2 90Q56 90.3 64.8 90Q64.9 94 64.8 98Q56 97.6 47.2 98Q47.1 94 47.2 90Z" fill="#FFC93C" stroke="#1F2430" stroke-width="2"/><path d="M47.2 92.4Q42 89.9 36.8 87.6" fill="none" stroke="#1F2430" stroke-width="2.2"/><path d="M29.6 85.2Q36.8 85.5 44 85.2" fill="none" stroke="#1F2430" stroke-width="2.2"/><path d="M64.8 92.4Q70 90.1 75.2 87.6" fill="none" stroke="#1F2430" stroke-width="2.2"/><path d="M68 85.2Q75.2 85.5 82.4 85.2" fill="none" stroke="#1F2430" stroke-width="2.2"/><path d="M52.8 98Q56 98.1 59.2 98Q59.3 100.4 59.2 102.8Q56 102.7 52.8 102.8Q52.8 100.4 52.8 98Z" fill="#2EC4B6" stroke="#1F2430" stroke-width="1.8"/><path d="M141.2 90Q150 89.8 158.8 90Q158.9 94 158.8 98Q150 97.7 141.2 98Q141.2 94 141.2 90Z" fill="#FFC93C" stroke="#1F2430" stroke-width="2"/><path d="M141.2 92.4Q136.1 89.8 130.8 87.6" fill="none" stroke="#1F2430" stroke-width="2.2"/><path d="M123.6 85.2Q130.8 85.4 138 85.2" fill="none" stroke="#1F2430" stro