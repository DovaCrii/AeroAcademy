<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="t d"><title id="t">Dibujo a mano: tres satélites GNSS, una base con coordenadas conocidas y un rover que recibe correcciones RTK por radio o internet</title><desc id="d">La base y el rover ven los mismos satélites. La base conoce su posición, calcula el error de la señal y envía correcciones al rover por radio o internet (NTRIP). Con la solución Fixed el rover llega a centímetros.</desc><g stroke-linecap="round" stroke-linejoin="round"><path d="M58 86Q66 85.9 74 86Q74 93 74 100Q66 100.1 58 100Q58 93 58 86Z" fill="#FFC93C" stroke="#1F2430" stroke-width="2"/><path d="M36 89Q45 88.9 54 89Q53.9 93 54 97Q45 97.2 36 97Q36.1 93 36 89Z" fill="#4CC9F0" fill-opacity="0.7" stroke="#1F2430" stroke-width="1.6"/><path d="M78 89Q87 88.6 96 89Q96.1 93 96 97Q87 97.1 78 97Q77.9 93 78 89Z" fill="#4CC9F0" fill-opacity="0.7" stroke="#1F2430" stroke-width="1.6"/><path d="M188 72Q196 72.2 204 72Q204.1 79 204 86Q196 85.8 188 86Q188.3 79 188 72Z" fill="#FFC93C" stroke="#1F2430" stroke-width="2"/><path d="M166 75Q175 74.8 184 75Q183.8 79 184 83Q175 82.7 166 83Q166.1 79 166 75Z" fill="#4CC9F0" fill-opacity="0.7" stroke="#1F2430" stroke-width="1.6"/><path d="M208 75Q217 74.6 226 75Q226 79 226 83Q217 82.9 208 83Q207.9 79 208 75Z" fill="#4CC9F0" fill-opacity="0.7" stroke="#1F2430" stroke-width="1.6"/><path d="M322 88Q330 87.8 338 88Q338.1 95 338 102Q330 102.2 322 102Q322.2 95 322 88Z" fill="#FFC93C" stroke="#1F2430" stroke-width="2"/><path d="M300 91Q309 90.9 318 91Q318 95 318 99Q309 98.9 300 99Q300.2 95 300 91Z" fill="#4CC9F0" fill-opacity="0.7" stroke="#1F2430" stroke-width="1.6"/><path d="M342 91Q351 90.8 360 91Q360.2 95 360 99Q351 98.6 342 99Q342.1 95 342 91Z" fill="#4CC9F0" fill-opacity="0.7" stroke="#1F2430" stroke-width="1.6"/><path d="M16 236Q200 236.7 384 236" fill="none" stroke="#1F2430" stroke-width="2.2"/><path d="M66 102Q78.9 137 92 172" fill="none" stroke="#5A6475" stroke-width="1.4" stroke-da