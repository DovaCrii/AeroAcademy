<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="t d"><title id="t">Dibujo a mano: dos nubes de puntos de estaciones distintas con esferas comunes que no coinciden; el registro las calza en una sola nube y la georreferenciación la amarra a puntos con coordenadas</title><desc id="d">Tres paneles. 1: dos escaneos, cada uno en su sistema local, con esferas que se ven en ambos. 2: el registro calza las zonas comunes y las esferas coinciden. 3: la nube se georreferencia con puntos de control con coordenadas E, N, Z. Abajo el flujo completo y la advertencia de que una nube bonita pero flotando no sirve.</desc><g stroke-linecap="round" stroke-linejoin="round"><path d="M14 34Q73 33.8 132 34Q131.9 93 132 152Q73 151.1 14 152Q13.2 93 14 34Z" fill="#FFC93C" fill-opacity="0.12" stroke="#1F2430" stroke-width="2"/><path d="M141 34Q200 33.3 259 34Q260.1 93 259 152Q200 152.9 141 152Q139.8 93 141 34Z" fill="#FFC93C" fill-opacity="0.12" stroke="#1F2430" stroke-width="2"/><path d="M268 34Q327 33.2 386 34Q386 93 386 152Q327 150.8 268 152Q268.5 93 268 34Z" fill="#FFC93C" fill-opacity="0.12" stroke="#1F2430" stroke-width="2"/><circle cx="23.6" cy="69.7" r="1.9" fill="#2EC4B6"/><circle cx="24.6" cy="79.4" r="1.9" fill="#2EC4B6"/><circle cx="22.6" cy="91.1" r="1.9" fill="#2EC4B6"/><circle cx="24.4" cy="98.8" r="1.9" fill="#2EC4B6"/><circle cx="22.6" cy="108.7" r="1.9" fill="#2EC4B6"/><circle cx="34.1" cy="68.7" r="1.9" fill="#2EC4B6"/><circle cx="33.1" cy="81.5" r="1.9" fill="#2EC4B6"/><circle cx="31.2" cy="89.6" r="1.9" fill="#2EC4B6"/><circle cx="32.6" cy="101.3" r="1.9" fill="#2EC4B6"/><circle cx="31.7" cy="109.2" r="1.9" fill="#2EC4B6"/><circle cx="40.5" cy="68.6" r="1.9" fill="#2EC4B6"/><circle cx="41.9" cy="81" r="1.9" fill="#2EC4B6"/><circle cx="41.1" cy="88.5" r="1.9" fill="#2EC4B6"/><circle cx="42" cy="100.8" r="1.9" fill="#2EC4B6"/><circle cx="41.8" cy="109.5" r="1.9" fill="#2EC4B6"/><circle cx="51.1" cy="70.4" r="1.9" fill="#2EC4B6"/><circ