<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="t d"><title id="t">Dibujo a mano: a la izquierda una red de triángulos irregulares TIN entre puntos con cota y una línea de quiebre; a la derecha una grilla ráster de cinco por cinco celdas con una cota por celda</title><desc id="d">El TIN une puntos medidos con triángulos y se adapta al relieve, y conserva los puntos reales y las líneas de quiebre. El ráster es una grilla de celdas iguales con una cota cada una; es liviano para analizar y el tamaño de celda marca el detalle. Con cualquiera se sacan curvas de nivel, pendientes y volúmenes.</desc><g stroke-linecap="round" stroke-linejoin="round"><path d="M10 34Q103 34.3 196 34Q197.1 150 196 266Q103 266.5 10 266Q9.3 150 10 34Z" fill="#4CC9F0" fill-opacity="0.12" stroke="#1F2430" stroke-width="2"/><path d="M204 34Q297 34.6 390 34Q389.6 150 390 266Q297 265.1 204 266Q203 150 204 34Z" fill="#FFC93C" fill-opacity="0.14" stroke="#1F2430" stroke-width="2"/><path d="M36 94Q67 86.9 98 80Q74.5 113.3 50 146Q42.7 120.1 36 94Z" fill="#BDA281" fill-opacity="0.55" stroke="#1F2430" stroke-width="1.6"/><path d="M98 80Q105 110 112 140Q81.1 143.6 50 146Q73.7 112.8 98 80Z" fill="#BAA384" fill-opacity="0.55" stroke="#1F2430" stroke-width="1.6"/><path d="M98 80Q127.9 90.2 158 100Q135 120 112 140Q104.7 110.1 98 80Z" fill="#D29B6D" fill-opacity="0.55" stroke="#1F2430" stroke-width="1.6"/><path d="M158 100Q162.9 128 168 156Q140.1 147.6 112 140Q134.6 119.6 158 100Z" fill="#96AFA7" fill-opacity="0.55" stroke="#1F2430" stroke-width="1.6"/><path d="M50 146Q81 143.4 112 140Q91.8 166.9 72 194Q60.8 170.1 50 146Z" fill="#87B4B5" fill-opacity="0.55" stroke="#1F2430" stroke-width="1.6"/><path d="M112 140Q126.4 169.8 140 200Q106 196.5 72 194Q91.8 166.9 112 140Z" fill="#84B5B8" fill-opacity="0.55" stroke="#1F2430" stroke-width="1.6"/><path d="M112 140Q140.1 147.5 168 156Q154.4 178.3 140 200Q126.4 169.8 112 140Z" fill="#7BB8C1" fill-opacity="0.55" stroke="#1F2430" st