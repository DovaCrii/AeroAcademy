<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="t d"><title id="t">Dibujo a mano: comparativa de captura masiva en tres columnas, escáner terrestre TLS sobre trípode, SLAM portátil que se camina y dron con fotogrametría o LiDAR, con precisión, ritmo, uso ideal y costo</title><desc id="d">TLS: escáner en trípode, precisión de milímetros, ritmo por estación, ideal para interiores y detalle fino, costo alto. SLAM: escáner portátil, precisión de centímetros, rápido caminando, ideal para pasillos, costo medio. Dron: fotogrametría o LiDAR, centímetros a decímetros, hectáreas por vuelo, terreno abierto, costo de bajo a alto, con reglas de DGAC.</desc><g stroke-linecap="round" stroke-linejoin="round"><path d="M14 32Q73 31.2 132 32Q131.5 160 132 288Q73 287.7 14 288Q13.9 160 14 32Z" fill="#2EC4B6" fill-opacity="0.18" stroke="#1F2430" stroke-width="2"/><path d="M73 118Q65.4 132.2 57 146" fill="none" stroke="#1F2430" stroke-width="2.6"/><path d="M73 118Q80.6 132.2 89 146" fill="none" stroke="#1F2430" stroke-width="2.6"/><path d="M73 118Q72.6 132 73 146" fill="none" stroke="#1F2430" stroke-width="2"/><path d="M61 92Q73 92 85 92Q85 105 85 118Q73 118.3 61 118Q60.4 105 61 92Z" fill="#E63946" fill-opacity="0.9" stroke="#1F2430" stroke-width="2.4"/><path d="M73 97.9C76.3 97.9 79 100.7 79 104C79 107.3 76.3 109.8 73 109.8C69.7 109.8 67.1 107.3 67.1 104C67.1 100.7 69.7 97.9 73 97.9Z" fill="#FFC93C" stroke="#1F2430" stroke-width="1.8"/><path d="M91.2 85.8 A26 26 0 0 1 91.2 122.2" fill="none" stroke="#C0293A" stroke-width="1.6" stroke-dasharray="3 4"/><path d="M98.2 78.8 A36 36 0 0 1 98.2 129.2" fill="none" stroke="#C0293A" stroke-width="1.6" stroke-dasharray="3 4"/><path d="M20 150Q73 149.4 126 150" fill="none" stroke="#1F2430" stroke-width="1.2" stroke-dasharray="2 5"/><path d="M141 32Q200 31.4 259 32Q260.1 160 259 288Q200 286.8 141 288Q141.6 160 141 32Z" fill="#FFC93C" fill-opacity="0.18" stroke="#1F2430" stroke-width="2"/><path d="M192 85.2C19