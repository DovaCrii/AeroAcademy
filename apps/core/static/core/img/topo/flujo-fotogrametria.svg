<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="t"><title id="t">Dibujo a mano: flujo de fotogrametría en seis pasos, de planificar el vuelo a obtener el ortomosaico y los modelos</title><g fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 40Q71.8 40.2 124 40Q125.4 74.9 124 110Q72 110.3 20 110Q19 75 20 40Z" fill="#FFC93C" fill-opacity="0.35"/><path d="M126 75Q145.5 76.1 164 75"/><path d="M164 75L156.1 79.3"/><path d="M164 75L156.1 70.7"/><path d="M148 40Q198.7 39.4 252 40Q250.7 76 252 110Q200.6 108.5 148 110Q149.5 76.5 148 40Z" fill="#4CC9F0" fill-opacity="0.35"/><path d="M254 75Q273.6 75.4 292 75"/><path d="M292 75L284.1 79.3"/><path d="M292 75L284.1 70.7"/><path d="M276 40Q326.9 38.4 380 40Q380.1 73.6 380 110Q327 109.2 276 110Q274.5 74.9 276 40Z" fill="#E63946" fill-opacity="0.35"/><path d="M20 170Q71.8 171.1 124 170Q124.1 205.4 124 240Q72 240.5 20 240Q19.9 204.3 20 170Z" fill="#2EC4B6" fill-opacity="0.35"/><path d="M126 205Q146.8 206.8 164 205"/><path d="M164 205L156.1 209.3"/><path d="M164 205L156.1 200.7"/><path d="M148 170Q201.1 170.7 252 170Q251.4 204.1 252 240Q199.3 238.6 148 240Q148.9 204.7 148 170Z" fill="#8AC926" fill-opacity="0.35"/><path d="M254 205Q274.2 204.6 292 205"/><path d="M292 205L284.1 209.3"/><path d="M292 205L284.1 200.7"/><path d="M276 170Q329.5 171.1 380 170Q378.4 204.1 380 240Q329.3 239.9 276 240Q277.5 204.7 276 170Z" fill="#FF8C42" fill-opacity="0.35"/><path d="M328 112Q328 142 264 142Q200 142 136 142Q72 142 72 166"/><path d="M72 168L67.7 160.1"/><path d="M72 168L76.3 160.1"/></g><g fill="currentColor" stroke="none" font-family="Archivo, system-ui, sans-serif"><text x="72" y="70" font-size="12.5" font-weight="700" text-anchor="middle">1 Planificar</text><text x="72" y="90" font-size="10.5" font-weight="400" text-anchor="middle">área, GSD, traslape</text><text x="200" y="70" font-size="12.5" font-weight="700" text-anchor="middle">2 Volar</text><text x="200" y="90" font-size="10.5" font-weight="400" text-anchor="middle">fotos con GNSS</text><text x="328" y="70" font-size="12.5" font-weight="700" text-anchor="middle">3 Controlar</text><text x="328" y="90" font-size="10.5" font-weight="400" text-anchor="middle">GCP y chequeo</text><text x="72" y="200" font-size="12.5" font-weight="700" text-anchor="middle">4 Aerotriangular</text><text x="72" y="220" font-size="10.5" font-weight="400" text-anchor="middle">poses de cámara</text><text x="200" y="200" font-size="12.5" font-weight="700" text-anchor="middle">5 Densificar</text><text x="200" y="220" font-size="10.5" font-weight="400" text-anchor="middle">nube densa y malla</text><text x="328" y="200" font-size="12.5" font-weight="700" text-anchor="middle">6 Productos</text><text x="328" y="220" font-size="10.5" font-weight="400" text-anchor="middle">MDS · MDT · orto</text><text x="200" y="22" font-size="14" font-weight="700" text-anchor="middle">Del vuelo al producto</text><text x="200" y="130" font-size="10.5" font-weight="400" text-anchor="middle" fill-opacity="0.8">con cada paso se guarda un informe</text><text x="200" y="268" font-size="11" font-weight="400" text-anchor="middle">Si un paso falla, los siguientes arrastran el error.</text><text x="200" y="286" font-size="11" font-weight="400" text-anchor="middle">Se corrige en el punto donde nació.</text></g></svg>