<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="t d"><title id="t">Dibujo a mano: flujo de fotogrametría en seis pasos, planificar, volar, controlar, aerotriangular, densificar y obtener productos, con un informe de calidad en cada paso</title><desc id="d">Seis cajas numeradas en dos filas: 1 planificar con área, GSD y traslape; 2 volar y tomar fotos con GNSS; 3 controlar con puntos de control y de chequeo; 4 aerotriangular para calcular las poses de cámara; 5 densificar a nube densa y malla; 6 productos MDS, MDT y ortomosaico. Un error de un paso se arrastra a los siguientes.</desc><g stroke-linecap="round" stroke-linejoin="round"><path d="M14 34Q70 32.8 126 34Q126.9 84 126 134Q70 134.3 14 134Q14.4 84 14 34Z" fill="#FFC93C" fill-opacity="0.2" stroke="#1F2430" stroke-width="2"/><path d="M26 37.8C30.4 37.8 33.8 41.6 33.8 46C33.8 50.4 30.4 53.8 26 53.8C21.6 53.8 18.2 50.4 18.2 46C18.2 41.6 21.6 37.8 26 37.8Z" fill="#FFC93C" stroke="#1F2430" stroke-width="2.4"/><path d="M36.0 74 L56.0 56 L78.0 72 L102.0 54" fill="none" stroke="#1F2430" stroke-width="2" stroke-dasharray="4 3"/><circle cx="36" cy="74" r="3" fill="#E63946"/><circle cx="56" cy="56" r="3" fill="#E63946"/><circle cx="78" cy="72" r="3" fill="#E63946"/><circle cx="102" cy="54" r="3" fill="#E63946"/><path d="M144 34Q200 33.2 256 34Q255.4 84 256 134Q200 133.6 144 134Q143.1 84 144 34Z" fill="#4CC9F0" fill-opacity="0.2" stroke="#1F2430" stroke-width="2"/><path d="M156 38C160.4 38 164 41.6 164 46C164 50.4 160.4 53.9 156 53.9C151.6 53.9 148.3 50.4 148.3 46C148.3 41.6 151.6 38 156 38Z" fill="#4CC9F0" stroke="#1F2430" stroke-width="2.4"/><path d="M191.8 54.2Q200 53.9 208.2 54.2Q208.4 58 208.2 61.8Q200 61.4 191.8 61.8Q191.7 58 191.8 54.2Z" fill="#FFC93C" stroke="#1F2430" stroke-width="2"/><path d="M191.8 56.5Q186.8 54.4 182 52" fill="none" stroke="#1F2430" stroke-width="2.2"/><path d="M175.2 49.8Q182 49.6 188.8 49.8" fill="none" stroke="#1F2430" stroke-width="2.2"/><path d="M20