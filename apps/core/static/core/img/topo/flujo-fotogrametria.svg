-anchor="middle"><tspan x="70">área · GSD</tspan><tspan x="70" dy="13.4">traslape</tspan></text><text x="156" y="50.2" font-size="12" font-weight="700" text-anchor="middle">2</text><text x="200" y="98" font-size="12.5" font-weight="700" text-anchor="middle">Volar</text><text x="200" y="112" font-size="11" text-anchor="middle"><tspan x="200">fotos con GNSS</tspan><tspan x="200" dy="13.4">(RTK o PPK)</tspan></text><text x="286" y="50.2" font-size="12" font-weight="700" text-anchor="middle">3</text><text x="330" y="98" font-size="12.5" font-weight="700" text-anchor="middle">Controlar</text><text x="330" y="112" font-size="11" text-anchor="middle"><tspan x="330">GCP y puntos</tspan><tspan x="330" dy="13.4">de chequeo</tspan></text><text x="26" y="172.2" font-size="12" font-weight="700" text-anchor="middle">4</text><text x="70" y="220" font-size="11.5" font-weight="700" text-anchor="middle">Aerotriangular</text><text x="70" y="234" font-size="11" text-anchor="middle"><tspan x="70">poses de cámara</tspan><tspan x="70" dy="13.4">y puntos de amarre</tspan></text><text x="156" y="172.2" font-size="12" font-weight="700" text-anchor="middle">5</text><text x="200" y="220" font-size="12.5" font-weight="700" text-anchor="middle">Densificar</text><text x="200" y="234" font-size="11" text-anchor="middle"><tspan x="200">nube densa</tspan><tspan x="200" dy="13.4">y malla</tspan></text><text x="286" y="172.2" font-size="12" font-weight="700" text-anchor="middle">6</text><text x="330" y="220" font-size="12.5" font-weight="700" text-anchor="middle">Productos</text><text x="330" y="234" font-size="11" text-anchor="middle"><tspan x="330">MDS · MDT</tspan><tspan x="330" dy="13.4">ortomosaico</tspan></text><text x="200" y="274" font-size="11.5" font-weight="700" text-anchor="middle">Cada paso deja un informe de calidad.</text><text x="200" y="290" font-size="11" text-anchor="middle" fill="#5A6475">Un error se arrastra: corrígelo donde nació.</text></g></svg>