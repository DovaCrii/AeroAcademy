<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="t d"><title id="t">Dibujo a mano: perfil con el terreno existente punteado y la superficie de diseño recta; lo que queda sobre el diseño es corte y lo que queda bajo el diseño es relleno; abajo un prisma entre dos secciones con la fórmula de áreas medias</title><desc id="d">El volumen de corte es lo que sobra sobre la superficie de diseño y el de relleno es lo que falta bajo ella. Por secciones, el volumen entre dos secciones de áreas A1 y A2 separadas una distancia d es aproximadamente el promedio de las áreas por la distancia. También se obtiene restando dos superficies, existente menos diseño. Se calcula sobre el MDT, no sobre el MDS.</desc><g stroke-linecap="round" stroke-linejoin="round"><path d="M20 100L23 98.2L26 96.4L29 94.7L32 92.9L35 91.2L38 89.5L41 87.8L44 86.2L47 84.6L50 83L53 81.5L56 80L59 78.6L62 77.3L65 76L68 74.7L71 73.6L74 72.5L77 71.5L80 70.6L83 69.7L86 68.9L89 68.3L92 67.7L95 67.2L98 66.7L101 66.4L104 66.2L107 66L110 66L113 66L116 66.2L119 66.4L122 66.7L125 67.2L128 67.7L131 68.3L134 68.9L137 69.7L140 70.6L143 71.5L146 72.5L149 73.6L152 74.7L155 76L158 77.2L161 78.6L164 80L167 81.5L170 83L173 84.6L176 86.2L179 87.8L182 89.5L185 91.2L188 92.9L191 94.7L194 96.4L197 98.2L200 100L200 100L20 100Z" fill="#FF8C42" fill-opacity="0.55"/><path d="M20 100L203 101.6L206 103.2L209 104.8L212 106.4L215 107.9L218 109.4L221 111L224 112.4L227 113.9L230 115.3L233 116.7L236 118L239 119.3L242 120.5L245 121.6L248 122.7L251 123.8L254 124.8L257 125.7L260 126.5L263 127.3L266 128L269 128.6L272 129.1L275 129.6L278 129.9L281 130.2L284 130.4L287 130.6L290 130.6L293 130.6L296 130.4L299 130.2L302 129.9L305 129.6L308 129.1L311 128.6L314 128L317 127.3L320 126.5L323 125.7L326 124.8L329 123.8L332 122.7L335 121.6L338 120.5L341 119.3L344 118L347 116.7L350 115.3L353 113.9L356 112.5L359 111L362 109.5L365 107.9L368 106.4L371 104.8L374 103.2L377 101.6L380 100L380 100L20 100Z" fill="#4CC9F0" fill-opa