<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="t d"><title id="t">Dibujo a mano: a la izquierda nivelación geométrica con un nivel entre dos miras, lectura atrás 1,52 m y adelante 0,80 m, desnivel 0,72 m; a la derecha una poligonal cerrada con su error de cierre</title><desc id="d">Nivelación: la cota del punto nuevo es la cota del BM más la lectura atrás menos la lectura adelante. Poligonal: se miden ángulos y distancias de vértice a vértice; al volver al inicio sobra un pequeño error de cierre que se reparte.</desc><g stroke-linecap="round" stroke-linejoin="round"><path d="M16 213.9L34 213.9L112 189.5L176 169.4L236 169.4L236 232L16 232Z" fill="#8AC926" fill-opacity="0.5"/><path d="M16 213.9Q25 214.4 34 213.9Q72.6 200.6 112 189.5Q144.2 180 176 169.4Q206 168.6 236 169.4" fill="none" stroke="#1F2430" stroke-width="2.6"/><path d="M30 100Q34 100.2 38 100Q39.2 157 38 213.9Q34 213.8 30 213.9Q30.4 157 30 100Z" fill="#FFFFFF" stroke="#1F2430" stroke-width="2"/><path d="M30 108Q34 108.1 38 108" fill="none" stroke="#1F2430" stroke-width="1.2"/><path d="M30 120Q32.5 120.1 35 120" fill="none" stroke="#1F2430" stroke-width="1.2"/><path d="M30 132Q34 131.9 38 132" fill="none" stroke="#1F2430" stroke-width="1.2"/><path d="M30 144Q32.5 144 35 144" fill="none" stroke="#1F2430" stroke-width="1.2"/><path d="M30 156Q34 156.1 38 156" fill="none" stroke="#1F2430" stroke-width="1.2"/><path d="M30 168Q32.5 167.9 35 168" fill="none" stroke="#1F2430" stroke-width="1.2"/><path d="M30 180Q34 179.9 38 180" fill="none" stroke="#1F2430" stroke-width="1.2"/><path d="M30 192Q32.5 191.9 35 192" fill="none" stroke="#1F2430" stroke-width="1.2"/><path d="M30 204Q34 204.1 38 204" fill="none" stroke="#1F2430" stroke-width="1.2"/><path d="M172 100Q176 100.1 180 100Q179.3 134.7 180 169.4Q176 169.6 172 169.4Q173 134.7 172 100Z" fill="#FFFFFF" stroke="#1F2430" stroke-width="2"/><path d="M172 108Q176 108 180 108" fill="none" stroke="#1F2430" stroke-width="1.2"/><pat