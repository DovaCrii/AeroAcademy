size="11" font-weight="600">Δh = atrás − adelante = 0,72 m</text><text x="16" y="278" font-size="11" font-weight="600">Cota P = 100,00 + 0,72 = 100,72 m</text><text x="264" y="96" font-size="12" font-weight="700" text-anchor="end">A</text><text x="368" y="80" font-size="12" font-weight="700" text-anchor="middle">B</text><text x="382" y="196" font-size="12" font-weight="700" text-anchor="middle">C</text><text x="274" y="204" font-size="12" font-weight="700" text-anchor="end">D</text><text x="330" y="138" font-size="11" font-weight="600" text-anchor="middle"><tspan x="330">ángulos y</tspan><tspan x="330" dy="13.4">distancias</tspan></text><text x="258" y="124" font-size="13" font-weight="700" text-anchor="end" fill="#C0293A">e</text><text x="250" y="222" font-size="11" font-weight="700" fill="#C0293A">e = error de cierre</text><text x="250" y="238" font-size="11"><tspan x="250">No cierra: sobra e;</tspan><tspan x="250" dy="13.4">se reparte entre</tspan><tspan x="250" dy="13.4">los vértices.</tspan></text><text x="200" y="292" font-size="11.5" font-weight="700" text-anchor="middle">Cerrar el circuito permite verificar.</text></g></svg>