<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="t d"><title id="t">Dibujo a mano: los cuatro estados de la información en un entorno común de datos, en curso, compartido, publicado y archivo, con las puertas de revisión, autorización y archivado entre ellos, y tres pilares: nombres, versiones y permisos</title><desc id="d">ISO 19650: un solo lugar de verdad. La información pasa de en curso a compartido tras una revisión, a publicado tras una autorización y a archivo al archivarse. Debajo, nombres y códigos acordados, versiones con trazabilidad y permisos por rol.</desc><g stroke-linecap="round" stroke-linejoin="round"><path d="M14 64Q54 65 94 64Q94.8 87 94 110Q54 109.9 14 110Q14 87 14 64Z" fill="#FFC93C" fill-opacity="0.7" stroke="#1F2430" stroke-width="2"/><path d="M111 64Q151 65.1 191 64Q191.3 87 191 110Q151 110.1 111 110Q111.2 87 111 64Z" fill="#4CC9F0" fill-opacity="0.7" stroke="#1F2430" stroke-width="2"/><path d="M208 64Q248 63.7 288 64Q287.1 87 288 110Q248 109.1 208 110Q208.5 87 208 64Z" fill="#8AC926" fill-opacity="0.7" stroke="#1F2430" stroke-width="2"/><path d="M305 64Q345 62.9 385 64Q383.9 87 385 110Q345 109.9 305 110Q305.2 87 305 64Z" fill="#C9CED8" fill-opacity="0.7" stroke="#1F2430" stroke-width="2"/><path d="M95 87Q102.5 87 110 87" fill="none" stroke="#1F2430" stroke-width="2.2"/><path d="M105.6 89.4L110 87L105.6 84.6" fill="none" stroke="#1F2430" stroke-width="2.2"/><path d="M192 87Q199.5 87 207 87" fill="none" stroke="#1F2430" stroke-width="2.2"/><path d="M202.6 89.4L207 87L202.6 84.6" fill="none" stroke="#1F2430" stroke-width="2.2"/><path d="M289 87Q296.5 87.3 304 87" fill="none" stroke="#1F2430" stroke-width="2.2"/><path d="M299.6 89.4L304 87L299.6 84.6" fill="none" stroke="#1F2430" stroke-width="2.2"/><path d="M14 158Q73 157.5 132 158Q132.9 203 132 248Q73 246.8 14 248Q13.4 203 14 158Z" fill="#2EC4B6" fill-opacity="0.12" stroke="#1F2430" stroke-width="1.8"/><path d="M141 158Q200 157.5 259 158Q259.1 203 259 248Q200 247 141 248Q140.7 203 141 158Z" fill="#2EC4B6" fill-opacity="0.12" stroke="#1F2430" stroke-width="1.8"/><path d="M268 158Q327 156.8 386 158Q386.6 203 386 248Q327 248.6 268 248Q266.8 203 268 158Z" fill="#2EC4B6" fill-opacity="0.12" stroke="#1F2430" stroke-width="1.8"/></g><g stroke="none" fill="#1F2430" font-family="Archivo, 'Segoe UI', system-ui, sans-serif"><text x="16" y="22" font-size="15" font-weight="700">CDE: estados de la información</text><text x="16" y="38" font-size="11.5" fill="#5A6475">ISO 19650 · un solo lugar de verdad</text><text x="54" y="92" font-size="11.5" font-weight="700" text-anchor="middle">En curso</text><text x="54" y="126" font-size="11" text-anchor="middle"><tspan x="54">lo produce</tspan><tspan x="54" dy="13.4">el equipo</tspan></text><text x="151" y="92" font-size="11.5" font-weight="700" text-anchor="middle">Compartido</text><text x="151" y="126" font-size="11" text-anchor="middle"><tspan x="151">todos revisan</tspan><tspan x="151" dy="13.4">y coordinan</tspan></text><text x="248" y="92" font-size="11.5" font-weight="700" text-anchor="middle">Publicado</text><text x="248" y="126" font-size="11" text-anchor="middle"><tspan x="248">autorizado:</tspan><tspan x="248" dy="13.4">se construye</tspan></text><text x="345" y="92" font-size="11.5" font-weight="700" text-anchor="middle">Archivo</text><text x="345" y="126" font-size="11" text-anchor="middle"><tspan x="345">historial</tspan><tspan x="345" dy="13.4">conservado</tspan></text><text x="102.5" y="58" font-size="11" font-weight="600" text-anchor="middle" fill="#C0293A">revisa</text><text x="199.5" y="58" font-size="11" font-weight="600" text-anchor="middle" fill="#C0293A">autoriza</text><text x="296.5" y="58" font-size="11" font-weight="600" text-anchor="middle" fill="#C0293A">archiva</text><text x="73" y="176" font-size="12" font-weight="700" text-anchor="middle">Nombres</text><text x="73" y="191" font-size="11" text-anchor="middle"><tspan x="73">un código en</tspan><tspan x="73" dy="13.4">cada archivo:</tspan><tspan x="73" dy="13.4">proyecto, autor,</tspan><tspan x="73" dy="13.4">tipo, rol, N°</tspan></text><text x="200" y="176" font-size="12" font-weight="700" text-anchor="middle">Versiones</text><text x="200" y="191" font-size="11" text-anchor="middle"><tspan x="200">quién cambió</tspan><tspan x="200" dy="13.4">qué y cuándo;</tspan><tspan x="200" dy="13.4">nada se pisa</tspan></text><text x="327" y="176" font-size="12" font-weight="700" text-anchor="middle">Permisos</text><text x="327" y="191" font-size="11" text-anchor="middle"><tspan x="327">no todos ven</tspan><tspan x="327" dy="13.4">ni editan todo;</tspan><tspan x="327" dy="13.4">roles definidos</tspan></text><text x="200" y="270" font-size="11.5" font-weight="700" text-anchor="middle">ISO 19650 pide ordenar la información,</text><text x="200" y="285" font-size="11.5" font-weight="700" text-anchor="middle">no solo dibujarla.</text></g></svg>