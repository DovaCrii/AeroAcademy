<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="t d"><title id="t">Dibujo a mano: un edificio real y su gemelo digital en línea punteada, con una flecha de datos de captura hacia el modelo y otra de decisiones hacia la obra, y tres etapas abajo, diseño BIM, as-built y gemelo vivo</title><desc id="d">La obra real se captura con escáner, drones y sensores y esos datos actualizan el gemelo digital; del gemelo salen decisiones de mantención y ajustes que vuelven a la obra. Tres etapas: diseño BIM (lo pretendido), as-built (lo que quedó, con mapa de desviaciones) y gemelo vivo (datos al día). Necesita datos vivos, dueño y propósito.</desc><g stroke-linecap="round" stroke-linejoin="round"><path d="M26 62Q71 62.2 116 62Q116.7 117 116 172Q71 171.7 26 172Q27.1 117 26 62Z" fill="#4CC9F0" fill-opacity="0.55" stroke="#1F2430" stroke-width="2.4"/><path d="M34 70Q38.5 69.8 43 70Q43 75 43 80Q38.5 80.1 34 80Q33.9 75 34 70Z" fill="#FFFFFF" fill-opacity="0.9" stroke="#1F2430" stroke-width="1.3"/><path d="M34 93.5Q38.5 93.7 43 93.5Q42.8 98.5 43 103.5Q38.5 103.4 34 103.5Q34 98.5 34 93.5Z" fill="#FFFFFF" fill-opacity="0.9" stroke="#1F2430" stroke-width="1.3"/><path d="M34 117Q38.5 117.2 43 117Q43.2 122 43 127Q38.5 127 34 127Q34 122 34 117Z" fill="#FFFFFF" fill-opacity="0.9" stroke="#1F2430" stroke-width="1.3"/><path d="M34 140.5Q38.5 140.3 43 140.5Q43 145.5 43 150.5Q38.5 150.6 34 150.5Q33.9 145.5 34 140.5Z" fill="#FFFFFF" fill-opacity="0.9" stroke="#1F2430" stroke-width="1.3"/><path d="M52.5 70Q57 69.8 61.5 70Q61.4 75 61.5 80Q57 80.2 52.5 80Q52.3 75 52.5 70Z" fill="#FFFFFF" fill-opacity="0.9" stroke="#1F2430" stroke-width="1.3"/><path d="M52.5 93.5Q57 93.7 61.5 93.5Q61.6 98.5 61.5 103.5Q57 103.4 52.5 103.5Q52.6 98.5 52.5 93.5Z" fill="#FFFFFF" fill-opacity="0.9" stroke="#1F2430" stroke-width="1.3"/><path d="M52.5 117Q57 117.1 61.5 117Q61.3 122 61.5 127Q57 127.2 52.5 127Q52.5 122 52.5 117Z" fill="#FFFFFF" fill-opacity="0.9" stroke="#1F2430" stroke