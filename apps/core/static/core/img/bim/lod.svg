<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="t d"><title id="t">Dibujo a mano: un muro con ventana en tres niveles de detalle geométrico, de bloque genérico a despiece de obra, y debajo barras que crecen con la información asociada; el nivel de información necesario depende del uso</title><desc id="d">Arriba la geometría: bloque con masa y ubicación, intermedio con tipo y medidas, detallado con despiece y montaje. Abajo la información asociada crece: pocos datos, tipo y medidas, fabricante y costo. El LOIN fija el nivel necesario según el uso del modelo.</desc><g stroke-linecap="round" stroke-linejoin="round"><path d="M14 52Q73 52.3 132 52Q131.1 97 132 142Q73 142.1 14 142Q14.5 97 14 52Z" fill="#4CC9F0" fill-opacity="0.16" stroke="#1F2430" stroke-width="1.8"/><path d="M33 78Q73 79 113 78Q113 100 113 122Q73 121.4 33 122Q33.5 100 33 78Z" fill="#D9DEE6" fill-opacity="0.9" stroke="#1F2430" stroke-width="2.2"/><path d="M141 52Q200 52.9 259 52Q260.1 97 259 142Q200 142.8 141 142Q142.2 97 141 52Z" fill="#4CC9F0" fill-opacity="0.16" stroke="#1F2430" stroke-width="1.8"/><path d="M160 78Q200 78.6 240 78Q240.5 100 240 122Q200 121.4 160 122Q159.3 100 160 78Z" fill="#D9DEE6" fill-opacity="0.9" stroke="#1F2430" stroke-width="2.2"/><path d="M182 86Q200 85.7 218 86Q218.1 100 218 114Q200 114.5 182 114Q181.5 100 182 86Z" fill="#FFFFFF" fill-opacity="0.9" stroke="#1F2430" stroke-width="2"/><path d="M268 52Q327 52 386 52Q385.6 97 386 142Q327 142.4 268 142Q268.4 97 268 52Z" fill="#4CC9F0" fill-opacity="0.16" stroke="#1F2430" stroke-width="1.8"/><path d="M287 78Q327 79.2 367 78Q368 100 367 122Q327 122.5 287 122Q286.1 100 287 78Z" fill="#D9DEE6" fill-opacity="0.9" stroke="#1F2430" stroke-width="2.2"/><path d="M309 86Q327 86.3 345 86Q345.1 100 345 114Q327 114.1 309 114Q308.6 100 309 86Z" fill="#FFFFFF" fill-opacity="0.9" stroke="#1F2430" stroke-width="2"/><path d="M327 86Q326.6 100 327 114" fill="none" stroke="#1F2430" stroke-width="1.6"/><path d=