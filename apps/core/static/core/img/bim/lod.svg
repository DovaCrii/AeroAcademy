="#FFC93C" fill-opacity="0.8" stroke-width="1.4"/><path d="M282 208Q300.6 208.9 321 208Q321.3 210.4 321 213Q302.8 212.6 282 213Q283 209 282 208Z" fill="#2EC4B6" fill-opacity="0.8" stroke-width="1.4"/><path d="M282 218Q311.5 217 338 218Q336.4 221.7 338 223Q310.7 223.6 282 223Q282.9 220.1 282 218Z" fill="#FF8C42" fill-opacity="0.8" stroke-width="1.4"/><path d="M282 228Q292.3 227.4 305 228Q306.5 232 305 233Q292.6 232.8 282 233Q281.8 231.8 282 228Z" fill="#8AC926" fill-opacity="0.8" stroke-width="1.4"/><path d="M282 238Q300.4 239.1 322 238Q321.2 240.7 322 243Q300.8 241.7 282 243Q283.2 240.5 282 238Z" fill="#E63946" fill-opacity="0.8" stroke-width="1.4"/></g><g fill="currentColor" stroke="none" font-family="Archivo, system-ui, sans-serif"><text x="70" y="146" font-size="12" font-weight="700" text-anchor="middle">Bloque</text><text x="70" y="160" font-size="10" font-weight="400" text-anchor="middle">masa y ubicación</text><text x="195" y="146" font-size="12" font-weight="700" text-anchor="middle">Intermedio</text><text x="195" y="160" font-size="10" font-weight="400" text-anchor="middle">tipo y medidas</text><text x="320" y="146" font-size="12" font-weight="700" text-anchor="middle">Detallado</text><text x="320" y="160" font-size="10" font-weight="400" text-anchor="middle">despiece y montaje</text><text x="20" y="22" font-size="12" font-weight="700">Geometría (nivel de detalle)</text><text x="20" y="188" font-size="12" font-weight="700">Información (propiedades asociadas)</text><text x="200" y="262" font-size="11" font-weight="600" text-anchor="middle">Se pide lo necesario para cada uso: ni más, ni menos.</text><text x="200" y="280" font-size="10.5" font-weight="400" text-anchor="middle">Más detalle no siempre es mejor: cuesta y se desactualiza.</text></g></svg>