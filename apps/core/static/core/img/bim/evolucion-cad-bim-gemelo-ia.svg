.6Z" fill="#FF8C42" stroke="#1F2430" stroke-width="1.4"/><path d="M49 228.6C50.9 228.6 52.5 230.1 52.5 232C52.5 233.9 50.9 235.3 49 235.3C47.1 235.3 45.7 233.9 45.7 232C45.7 230.1 47.1 228.6 49 228.6Z" fill="#FF8C42" stroke="#1F2430" stroke-width="1.4"/></g><g stroke="none" fill="#1F2430" font-family="Archivo, 'Segoe UI', system-ui, sans-serif"><text x="16" y="22" font-size="15" font-weight="700">Cómo evolucionó el diseño digital</text><text x="86" y="52" font-size="13" font-weight="700">CAD</text><text x="86" y="66" font-size="11">dibuja líneas: el plano es el producto</text><text x="378" y="52" font-size="11" font-weight="600" text-anchor="end" fill="#5A6475">¿Cómo se dibuja?</text><text x="86" y="106" font-size="13" font-weight="700">BIM</text><text x="86" y="120" font-size="11">modela objetos con geometría y datos</text><text x="378" y="106" font-size="11" font-weight="600" text-anchor="end" fill="#5A6475">¿Qué es cada objeto?</text><text x="86" y="160" font-size="13" font-weight="700">Gemelo digital</text><text x="86" y="174" font-size="11">conecta el modelo con datos reales</text><text x="378" y="160" font-size="11" font-weight="600" text-anchor="end" fill="#5A6475">¿Cómo está hoy el activo?</text><text x="86" y="214" font-size="13" font-weight="700">IA y automatización</text><text x="86" y="228" font-size="11">genera alternativas, revisa reglas, analiza</text><text x="378" y="214" font-size="11" font-weight="600" text-anchor="end" fill="#5A6475">¿Qué conviene hacer?</text><text x="200" y="270" font-size="11.5" font-weight="700" text-anchor="middle">Cada etapa se apoya en la anterior:</text><text x="200" y="285" font-size="11" text-anchor="middle">sin buen dato de base, la IA solo acelera los errores.</text></g></svg>