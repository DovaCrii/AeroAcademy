<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="t"><title id="t">Dibujo a mano: cuatro etapas del diseño digital en construcción, CAD que dibuja, BIM que modela información, gemelo digital que integra fuentes y ciclo de vida, e inteligencia artificial que genera y revisa</title><g fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M30 62Q52.4 61.8 74 62Q74.7 82.6 74 106Q52.6 105.6 30 106Q30.3 82.9 30 62Z"/><path d="M30 62Q51.4 83.2 74 106" stroke-width="1.8"/><path d="M74 62Q51.4 84.8 30 106" stroke-width="1.8"/><path d="M120 73.6Q136.9 75.1 154 73.6Q154.3 89.7 154 107.6Q137.4 107.7 120 107.6Q118.9 90.7 120 73.6Z" fill="#4CC9F0" fill-opacity="0.55"/><path d="M120 73.6Q125.2 66.4 133.6 60Q150.7 60.6 167.6 60Q162.3 67.2 154 73.6Q135.5 73.5 120 73.6Z" fill="#4CC9F0" fill-opacity="0.3"/><path d="M154 73.6Q160 67.6 167.6 60Q168.9 75.7 167.6 94Q161.7 100.1 154 107.6Q153 90.5 154 73.6Z" fill="#4CC9F0" fill-opacity="0.4"/><path d="M222 72Q235.7 71.3 250 72Q249.2 89.8 250 108Q236.6 106.9 222 108Q221.6 89.2 222 72Z" fill="#FF8C42" fill-opacity="0.5"/><path d="M256 72Q270.7 71.2 284 72Q284.8 88.5 284 108Q271.1 107.8 256 108Q257.4 90.9 256 72Z" stroke="#2EC4B6" stroke-dasharray="5 4"/><circle cx="270" cy="90" r="3.5" fill="#4CC9F0" stroke="none"/><circle cx="320" cy="100" r="4" fill="#FFC93C" stroke="none"/><circle cx="346" cy="66" r="4" fill="#FFC93C" stroke="none"/><circle cx="372" cy="100" r="4" fill="#FFC93C" stroke="none"/><circle cx="346" cy="92" r="4" fill="#FFC93C" stroke="none"/><path d="M320 100Q334.2 81.3 346 66" stroke-width="1.6"/><path d="M346 66Q359.9 83.1 372 100" stroke-width="1.6"/><path d="M320 100Q334.4 96.2 346 92" stroke-width="1.6"/><path d="M346 92Q358.5 97.5 372 100" stroke-width="1.6"/><path d="M346 66Q347.8 78 346 92" stroke-width="1.6"/><path d="M364 56Q364.9 59.8 368 64Q372.5 63.9 376 66Q372.3 68.1 368 70Q367 72.9 364 78Q360.8 74.1 360 70Q356.8 68.3 352 66Q356.8 64.2 360 64Q360.5 60.6 364 56Z" fill="#FF8C42" stroke-width="1.5"/><path d="M90 84Q99.5 82.3 108 84" stroke-width="2"/><path d="M108 84L102.7 86.9" stroke-width="2"/><path d="M108 84L102.7 81.1" stroke-width="2"/><path d="M190 84Q197.5 84.7 208 84" stroke-width="2"/><path d="M208 84L202.7 86.9" stroke-width="2"/><path d="M208 84L202.7 81.1" stroke-width="2"/><path d="M290 84Q299.6 82.9 308 84" stroke-width="2"/><path d="M308 84L302.7 86.9" stroke-width="2"/><path d="M308 84L302.7 81.1" stroke-width="2"/><path d="M26 210Q198.1 199.7 372 190" stroke-width="2.4"/><path d="M372 190L364.4 194.8" stroke-width="2.4"/><path d="M372 190L363.9 186.1" stroke-width="2.4"/></g><g fill="currentColor" stroke="none" font-family="Archivo, system-ui, sans-serif"><text x="200" y="22" font-size="13" font-weight="700" text-anchor="middle">Cómo evolucionó el diseño digital</text><text x="52" y="142" font-size="13" font-weight="700" text-anchor="middle">CAD</text><text x="52" y="158" font-size="10.5" font-weight="400" text-anchor="middle">dibuja líneas</text><text x="148" y="142" font-size="13" font-weight="700" text-anchor="middle">BIM</text><text x="148" y="158" font-size="10.5" font-weight="400" text-anchor="middle">modela objetos</text><text x="148" y="171" font-size="10.5" font-weight="400" text-anchor="middle">con datos</text><text x="248" y="142" font-size="13" font-weight="700" text-anchor="middle">Gemelo</text><text x="248" y="158" font-size="10.5" font-weight="400" text-anchor="middle">integra fuentes</text><text x="248" y="171" font-size="10.5" font-weight="400" text-anchor="middle">y ciclo de vida</text><text x="346" y="142" font-size="13" font-weight="700" text-anchor="middle">IA</text><text x="346" y="158" font-size="10.5" font-weight="400" text-anchor="middle">genera, revisa</text><text x="346" y="171" font-size="10.5" font-weight="400" text-anchor="middle">y analiza</text><text x="200" y="232" font-size="11" font-weight="600" text-anchor="middle">más datos conectados, más decisiones apoyadas</text><text x="200" y="262" font-size="10.5" font-weight="400" text-anchor="middle">Cada etapa se apoya en la anterior:</text><text x="200" y="276" font-size="10.5" font-weight="400" text-anchor="middle">sin buen dato de base, la IA solo acelera los errores.</text></g></svg>