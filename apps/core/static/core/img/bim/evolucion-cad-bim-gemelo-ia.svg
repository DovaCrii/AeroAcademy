<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="t d"><title id="t">Dibujo a mano: cuatro etapas del diseño digital en construcción en una escalera descendente, CAD que dibuja líneas, BIM que modela objetos con datos, gemelo digital que conecta el modelo con datos reales y la inteligencia artificial que genera, revisa y analiza</title><desc id="d">Cada etapa responde una pregunta distinta: cómo se dibuja, qué es cada objeto, cómo está hoy el activo y qué conviene hacer. Cada una se apoya en la anterior; sin buen dato de base, la IA solo acelera los errores.</desc><g stroke-linecap="round" stroke-linejoin="round"><path d="M14 34Q200 33.4 386 34Q386 58 386 82Q200 82.8 14 82Q14.8 58 14 34Z" fill="#FFC93C" fill-opacity="0.2" stroke="#1F2430" stroke-width="2"/><path d="M22 40Q49 39.4 76 40Q75.9 58 76 76Q49 75 22 76Q21.8 58 22 40Z" fill="#FFFFFF" fill-opacity="0.9" stroke="#1F2430" stroke-width="1.8"/><path d="M30 68Q49 68.9 68 68" fill="none" stroke="#1F2430" stroke-width="1.8"/><path d="M30 68Q30.2 58 30 48" fill="none" stroke="#1F2430" stroke-width="1.8"/><path d="M30 48Q49 48.1 68 48" fill="none" stroke="#1F2430" stroke-width="1.8"/><path d="M68 48Q67.9 58 68 68" fill="none" stroke="#1F2430" stroke-width="1.8"/><path d="M30 68Q49.1 58.2 68 48" fill="none" stroke="#1F2430" stroke-width="1.4" stroke-dasharray="3 3"/><path d="M14 88Q200 87.7 386 88Q384.8 112 386 136Q200 136.2 14 136Q15.2 112 14 88Z" fill="#4CC9F0" fill-opacity="0.2" stroke="#1F2430" stroke-width="2"/><path d="M22 94Q49 94.8 76 94Q76.8 112 76 130Q49 130.6 22 130Q22 112 22 94Z" fill="#FFFFFF" fill-opacity="0.9" stroke="#1F2430" stroke-width="1.8"/><path d="M33 110Q41.2 105.3 49 100Q57.2 104.7 65 110Q56.9 114.9 49 120Q40.9 115.1 33 110Z" fill="#FFC93C" fill-opacity="0.9" stroke="#1F2430" stroke-width="1.8"/><path d="M33 110Q40.9 115.2 49 120Q48.7 126 49 132Q41.1 126.8 33 122Q32.8 116 33 110Z" fill="#4CC9F0" fill-opacity="0.9" stroke="#1F2430" stroke-width="1.8"/><pat