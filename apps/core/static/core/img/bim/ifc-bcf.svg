<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="t d"><title id="t">Dibujo a mano: dos programas distintos intercambian el modelo a través del formato abierto IFC y lo abren en un visor; abajo dos personas se pasan una nota BCF con vista, comentario, responsable y estado, sin llevar el modelo</title><desc id="d">IFC: el modelo viaja entre programas en un formato abierto; al exportar se revisan unidades, coordenadas y clases de objeto. BCF: la conversación viaja como una incidencia con vista del modelo, comentario, responsable y estado, sin el modelo. Flujo sano: nativo para modelar, IFC para intercambiar, BCF para coordinar.</desc><g stroke-linecap="round" stroke-linejoin="round"><path d="M10 32Q200 31 390 32Q388.9 90 390 148Q200 148.8 10 148Q10.6 90 10 32Z" fill="#4CC9F0" fill-opacity="0.12" stroke="#1F2430" stroke-width="2"/><path d="M20 62Q64 62.8 108 62Q107.5 82 108 102Q64 102.5 20 102Q19.7 82 20 62Z" fill="#FFC93C" fill-opacity="0.7" stroke="#1F2430" stroke-width="2"/><path d="M292 62Q336 62.5 380 62Q379.1 82 380 102Q336 101.6 292 102Q292.1 82 292 62Z" fill="#2EC4B6" fill-opacity="0.7" stroke="#1F2430" stroke-width="2"/><path d="M150 58Q200 57.7 250 58Q250.2 82 250 106Q200 105.5 150 106Q149.8 82 150 58Z" fill="#FFFFFF" stroke="#1F2430" stroke-width="2.4"/><path d="M110 82Q129 82.1 148 82" fill="none" stroke="#1F2430" stroke-width="2.4"/><path d="M142.7 84.9L148 82L142.7 79.1" fill="none" stroke="#1F2430" stroke-width="2.4"/><path d="M252 82Q271 82.2 290 82" fill="none" stroke="#1F2430" stroke-width="2.4"/><path d="M284.7 84.9L290 82L284.7 79.1" fill="none" stroke="#1F2430" stroke-width="2.4"/><path d="M10 156Q200 156.3 390 156Q391.1 204 390 252Q200 252.6 10 252Q10.5 204 10 156Z" fill="#FF8C42" fill-opacity="0.12" stroke="#1F2430" stroke-width="2"/><path d="M40 197.3C43 197.3 45.6 199.8 45.6 202.8C45.6 205.8 43 208.1 40 208.1C37 208.1 34.4 205.8 34.4 202.8C34.4 199.8 37 197.3 40 197.3Z" fill="#FFC93C" stroke="#1F2430" str