" fill-opacity="0.35" stroke="#1F2430" stroke-width="1.8"/><path d="M266 264Q326 263.9 386 264Q386 277 386 290Q326 290 266 290Q266.1 277 266 264Z" fill="#FFC93C" fill-opacity="0.35" stroke="#1F2430" stroke-width="1.8"/></g><g stroke="none" fill="#1F2430" font-family="Archivo, 'Segoe UI', system-ui, sans-serif"><text x="16" y="22" font-size="15" font-weight="700">IFC: el modelo viaja · BCF: la charla</text><text x="20" y="50" font-size="12" font-weight="700">IFC · formato abierto del modelo</text><text x="64" y="86" font-size="11.5" font-weight="700" text-anchor="middle">Programa A</text><text x="336" y="80" font-size="11.5" font-weight="700" text-anchor="middle"><tspan x="336">Programa B</tspan><tspan x="336" dy="14">o visor</tspan></text><text x="200" y="78" font-size="15" font-weight="800" text-anchor="middle">IFC</text><text x="200" y="100" font-size="11" text-anchor="middle">objetos + datos</text><text x="20" y="122" font-size="11" font-weight="600">Al exportar, revisa: unidades · coordenadas · clases</text><text x="20" y="135" font-size="11">(un muro debe ser un muro) · propiedades pedidas</text><text x="20" y="174" font-size="12" font-weight="700">BCF · la conversación viaja, sin el modelo</text><text x="154" y="201" font-size="11" font-weight="600">vista del modelo</text><text x="154" y="215" font-size="11">comentario</text><text x="154" y="229" font-size="11">responsable · estado</text><text x="74" y="281" font-size="11" font-weight="700" text-anchor="middle">Nativo = modelar</text><text x="200" y="281" font-size="11" font-weight="700" text-anchor="middle">IFC = intercambiar</text><text x="326" y="281" font-size="11" font-weight="700" text-anchor="middle">BCF = coordinar</text></g></svg>