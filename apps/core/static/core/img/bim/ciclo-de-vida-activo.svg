<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="t d"><title id="t">Dibujo a mano: ciclo de vida de un activo en cuatro fases, diseño, construcción, operación y renovación, y dos barras que comparan en general el costo de construir con el de operar</title><desc id="d">Un activo pasa por diseño, construcción, operación y renovación, y vuelve a empezar; la mayor parte de su vida es operación. CAPEX es construir y OPEX es operar y mantener; acumulado en décadas, en muchos activos el OPEX pesa más, según el tipo de activo. Un as-built confiable abarata decidir, mantener y renovar.</desc><g stroke-linecap="round" stroke-linejoin="round"><path d="M14 54Q59 53.3 104 54Q103.1 74 104 94Q59 92.9 14 94Q13 74 14 54Z" fill="#FFC93C" fill-opacity="0.6" stroke="#1F2430" stroke-width="2.2"/><path d="M112 54Q157 54.8 202 54Q201.6 74 202 94Q157 93.6 112 94Q111 74 112 54Z" fill="#4CC9F0" fill-opacity="0.6" stroke="#1F2430" stroke-width="2.2"/><path d="M112 150Q157 150.8 202 150Q202.2 170 202 190Q157 189.3 112 190Q112.1 170 112 150Z" fill="#8AC926" fill-opacity="0.6" stroke="#1F2430" stroke-width="2.2"/><path d="M14 150Q59 150.6 104 150Q103.5 170 104 190Q59 190.4 14 190Q14.3 170 14 150Z" fill="#FF8C42" fill-opacity="0.6" stroke="#1F2430" stroke-width="2.2"/><path d="M105 74Q107.5 74.1 110 74" fill="none" stroke="#1F2430" stroke-width="2.4"/><path d="M105.6 76.4L110 74L105.6 71.6" fill="none" stroke="#1F2430" stroke-width="2.4"/><path d="M157 96Q156.1 122 157 148" fill="none" stroke="#1F2430" stroke-width="2.4"/><path d="M154.1 142.7L157 148L159.9 142.7" fill="none" stroke="#1F2430" stroke-width="2.4"/><path d="M110 170Q107.5 169.9 105 170" fill="none" stroke="#1F2430" stroke-width="2.4"/><path d="M109.4 167.6L105 170L109.4 172.4" fill="none" stroke="#1F2430" stroke-width="2.4"/><path d="M59 148Q58 122 59 96" fill="none" stroke="#1F2430" stroke-width="2.4"/><path d="M61.9 101.3L59 96L56.1 101.3" fill="none" stroke="#1F2430" stroke-width="2.4"/><path d="M222 64Q255 64.3 288 64Q287.7 74 288 84Q255 84.5 222 84Q221.5 74 222 64Z" fill="#FFC93C" fill-opacity="0.9" stroke="#1F2430" stroke-width="2"/><path d="M222 120Q302 120.6 382 120Q381.9 130 382 140Q302 138.9 222 140Q221.8 130 222 120Z" fill="#FF8C42" fill-opacity="0.9" stroke="#1F2430" stroke-width="2"/><path d="M14 236Q200 235 386 236Q385.8 263 386 290Q200 289.2 14 290Q14.4 263 14 236Z" fill="#2EC4B6" fill-opacity="0.14" stroke="#1F2430" stroke-width="1.8"/></g><g stroke="none" fill="#1F2430" font-family="Archivo, 'Segoe UI', system-ui, sans-serif"><text x="16" y="22" font-size="15" font-weight="700">Ciclo de vida del activo</text><text x="59" y="78" font-size="11.5" font-weight="700" text-anchor="middle">Diseño</text><text x="157" y="78" font-size="11.5" font-weight="700" text-anchor="middle">Construcción</text><text x="157" y="174" font-size="11.5" font-weight="700" text-anchor="middle">Operación</text><text x="59" y="174" font-size="11.5" font-weight="700" text-anchor="middle">Renovación</text><text x="108" y="126" font-size="11.5" font-weight="700" text-anchor="middle" fill="#5A6475">activo</text><text x="108" y="214" font-size="11" text-anchor="middle"><tspan x="108">la mayor parte de su vida</tspan><tspan x="108" dy="13.4">es operación</tspan></text><text x="222" y="56" font-size="11.5" font-weight="700">CAPEX · construir</text><text x="222" y="112" font-size="11.5" font-weight="700">OPEX · operar y mantener</text><text x="222" y="160" font-size="11"><tspan x="222">Acumulado en décadas, en</tspan><tspan x="222" dy="13.4">muchos activos el OPEX</tspan><tspan x="222" dy="13.4">pesa más (varía por tipo).</tspan></text><text x="200" y="256" font-size="11.5" font-weight="700" text-anchor="middle">Un as-built confiable abarata decidir,</text><text x="200" y="270" font-size="11.5" font-weight="700" text-anchor="middle">mantener y renovar.</text><text x="200" y="284" font-size="11" text-anchor="middle">La IA rinde mejor con datos ordenados.</text></g></svg>