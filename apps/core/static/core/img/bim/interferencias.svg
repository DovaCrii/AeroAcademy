-weight="600" text-anchor="middle"><tspan x="124">Reglas con</tspan><tspan x="124" dy="13.4">selección</tspan></text><text x="174" y="202.2" font-size="12" font-weight="700" text-anchor="middle">3</text><text x="199" y="217" font-size="11" font-weight="600" text-anchor="middle"><tspan x="199">Informe</tspan><tspan x="199" dy="13.4">y BCF</tspan></text><text x="249" y="202.2" font-size="12" font-weight="700" text-anchor="middle">4</text><text x="274" y="217" font-size="11" font-weight="600" text-anchor="middle"><tspan x="274">Corregir</tspan><tspan x="274" dy="13.4">en origen</tspan></text><text x="324" y="202.2" font-size="12" font-weight="700" text-anchor="middle">5</text><text x="349" y="217" font-size="11" font-weight="600" text-anchor="middle"><tspan x="349">Repetir</tspan><tspan x="349" dy="13.4">la prueba</tspan></text><text x="200" y="258" font-size="11" text-anchor="middle">No revises todo contra todo: ahoga en falsos positivos.</text><text x="200" y="272" font-size="11" text-anchor="middle">Todos los modelos con el mismo origen y coordenadas.</text><text x="200" y="292" font-size="11" font-weight="700" text-anchor="middle">Detectar en el modelo cuesta menos que corregir en obra.</text></g></svg>