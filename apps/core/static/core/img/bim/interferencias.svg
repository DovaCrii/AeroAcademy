<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="t d"><title id="t">Dibujo a mano: un ducto atraviesa una viga y se marca el choque en rojo; a la derecha tres tipos de interferencia, dura, blanda y de tiempo; abajo cinco pasos para resolverlas, federar, reglas, informe BCF, corregir en el origen y repetir la prueba</title><desc id="d">Interferencia dura: dos elementos ocupan el mismo lugar. Blanda: falta holgura para operar o mantener. De tiempo, 4D: dos cuadrillas coinciden en el sitio. Pasos: federar los modelos, correr reglas con selecciones, informar con BCF, corregir en el modelo de origen y repetir la prueba.</desc><g stroke-linecap="round" stroke-linejoin="round"><path d="M18 70Q93 68.9 168 70Q167.9 83 168 96Q93 97.2 18 96Q18 83 18 70Z" fill="#C9CED8" fill-opacity="0.9" stroke="#1F2430" stroke-width="2.4"/><path d="M78 54Q93 54.7 108 54Q108.5 113 108 172Q93 171.3 78 172Q78.3 113 78 54Z" fill="#4CC9F0" fill-opacity="0.75" stroke="#1F2430" stroke-width="2.4"/><path d="M78 70Q93 70.6 108 70Q108.6 83 108 96Q93 95.6 78 96Q78 83 78 70Z" fill="#E63946" fill-opacity="0.55" stroke="#1F2430" stroke-width="2.4" stroke-dasharray="3 3"/><path d="M93 61.2C105.2 61.2 114.8 70.8 114.8 83C114.8 95.2 105.2 105.8 93 105.8C80.8 105.8 71.3 95.2 71.3 83C71.3 70.8 80.8 61.2 93 61.2Z" fill="none" stroke="#E63946" stroke-width="2" stroke-dasharray="2 3"/><path d="M190 44Q288 44.5 386 44Q385.7 63 386 82Q288 81.9 190 82Q190.6 63 190 44Z" fill="#E63946" fill-opacity="0.2" stroke="#1F2430" stroke-width="1.8"/><path d="M198 52Q209 52.1 220 52Q219.9 63 220 74Q209 74.3 198 74Q198 63 198 52Z" fill="#E63946" fill-opacity="0.8" stroke="#1F2430" stroke-width="1.6"/><path d="M190 88Q288 87.2 386 88Q385.8 107 386 126Q288 126.2 190 126Q190.5 107 190 88Z" fill="#FF8C42" fill-opacity="0.2" stroke="#1F2430" stroke-width="1.8"/><path d="M198 96Q209 96.1 220 96Q220.1 107 220 118Q209 118 198 118Q197.8 107 198 96Z" fill="#FF8C42" fill-opacity="0.8" stroke="#1F2430