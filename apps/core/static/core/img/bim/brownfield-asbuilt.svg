 en una ventana de detención corta:</text><text x="200" y="267" font-size="11" text-anchor="middle">su punto de empalme se mide con alta confianza.</text><text x="200" y="292" font-size="11" font-weight="700" text-anchor="middle">Sin as-built confiable, cada intervención parte a ciegas.</text></g></svg>