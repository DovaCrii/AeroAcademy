<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="t d"><title id="t">Dibujo a mano: tres capturas que se complementan en una planta existente, escáner láser sobre trípode para lo visible, dron con fotogrametría para el contexto y georradar para las redes enterradas, y el camino del as-built al tie-in</title><desc id="d">Escáner láser: lo visible y el detalle fino, precisión de milímetros. Dron con fotogrametría: contexto y cubiertas, centímetros. Georradar: redes enterradas; la profundidad útil depende del suelo y lo crítico se verifica con calicata. Camino: as-built, diseño, prefabricar y tie-in en la ventana de detención.</desc><g stroke-linecap="round" stroke-linejoin="round"><path d="M14 32Q73 31.5 132 32Q131.8 107 132 182Q73 182.6 14 182Q14.7 107 14 32Z" fill="#2EC4B6" fill-opacity="0.16" stroke="#1F2430" stroke-width="2"/><path d="M141 32Q200 31.9 259 32Q259.4 107 259 182Q200 181 141 182Q141.7 107 141 32Z" fill="#4CC9F0" fill-opacity="0.16" stroke="#1F2430" stroke-width="2"/><path d="M268 32Q327 32.9 386 32Q385.6 107 386 182Q327 182.8 268 182Q267.7 107 268 32Z" fill="#FF8C42" fill-opacity="0.16" stroke="#1F2430" stroke-width="2"/><path d="M73 90Q66.3 100.2 59 110" fill="none" stroke="#1F2430" stroke-width="2.4"/><path d="M73 90Q79.7 100.2 87 110" fill="none" stroke="#1F2430" stroke-width="2.4"/><path d="M73 90Q73.5 100 73 110" fill="none" stroke="#1F2430" stroke-width="2"/><path d="M63 66Q73 66.3 83 66Q83.4 78 83 90Q73 90.2 63 90Q63.2 78 63 66Z" fill="#E63946" fill-opacity="0.9" stroke="#1F2430" stroke-width="2.4"/><path d="M73 72.1C75.8 72.1 78 74.2 78 77C78 79.8 75.8 82 73 82C70.2 82 68 79.8 68 77C68 74.2 70.2 72.1 73 72.1Z" fill="#FFC93C" stroke="#1F2430" stroke-width="1.6"/><path d="M190.7 69.8Q200 69.8 209.3 69.8Q209.5 74 209.3 78.2Q200 78.4 190.7 78.2Q190.4 74 190.7 69.8Z" fill="#FFC93C" stroke="#1F2430" stroke-width="2"/><path d="M190.7 72.3Q185.1 69.7 179.6 67.2" fill="none" stroke="#1F2430" stroke-width="2.2"/><