<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="t d"><title id="t">Dibujo a mano: escalera de madurez BIM del nivel cero al tres y una lista de las dimensiones 3D forma, 4D tiempo, 5D costo, 6D sostenibilidad y 7D operación</title><desc id="d">Arriba, cuatro peldaños de madurez: 0 dibujos 2D sueltos, 1 modelos 3D con datos, 2 colaboración entre especialidades y 3 datos integrados durante todo el ciclo de vida. Abajo, cada dimensión suma una pregunta al modelo; solo valen si el dato de base es confiable.</desc><g stroke-linecap="round" stroke-linejoin="round"><path d="M14 118Q59 119.1 104 118Q104.5 129 104 140Q59 139.5 14 140Q14 129 14 118Z" fill="#FFC93C" fill-opacity="0.7" stroke="#1F2430" stroke-width="2"/><path d="M28 122.3C32.4 122.3 35.9 125.6 35.9 130C35.9 134.4 32.4 138.3 28 138.3C23.6 138.3 19.8 134.4 19.8 130C19.8 125.6 23.6 122.3 28 122.3Z" fill="#FFC93C" stroke="#1F2430" stroke-width="2.4"/><path d="M106 98Q151 99.2 196 98Q196.2 119 196 140Q151 140.8 106 140Q105.7 119 106 98Z" fill="#4CC9F0" fill-opacity="0.7" stroke="#1F2430" stroke-width="2"/><path d="M120 102.1C124.4 102.1 127.7 105.6 127.7 110C127.7 114.4 124.4 117.9 120 117.9C115.6 117.9 111.7 114.4 111.7 110C111.7 105.6 115.6 102.1 120 102.1Z" fill="#4CC9F0" stroke="#1F2430" stroke-width="2.4"/><path d="M198 78Q243 77 288 78Q288.8 109 288 140Q243 140.6 198 140Q197.5 109 198 78Z" fill="#2EC4B6" fill-opacity="0.7" stroke="#1F2430" stroke-width="2"/><path d="M212 82.2C216.4 82.2 219.9 85.6 219.9 90C219.9 94.4 216.4 98.2 212 98.2C207.6 98.2 204.3 94.4 204.3 90C204.3 85.6 207.6 82.2 212 82.2Z" fill="#2EC4B6" stroke="#1F2430" stroke-width="2.4"/><path d="M290 58Q335 58.9 380 58Q378.9 99 380 140Q335 139.8 290 140Q290.4 99 290 58Z" fill="#8AC926" fill-opacity="0.7" stroke="#1F2430" stroke-width="2"/><path d="M304 62.2C308.4 62.2 312 65.6 312 70C312 74.4 308.4 77.8 304 77.8C299.6 77.8 296 74.4 296 70C296 65.6 299.6 62.2 304 62.2Z" fill="#8AC926" stroke="#1F2430" stroke-width="2.4"/><path d="M16 173Q32 173 48 173Q48.3 181 48 189Q32 189.3 16 189Q15.7 181 16 173Z" fill="#FFC93C" fill-opacity="0.9" stroke="#1F2430" stroke-width="1.6"/><path d="M16 192Q32 192.2 48 192Q47.8 200 48 208Q32 207.9 16 208Q15.9 200 16 192Z" fill="#4CC9F0" fill-opacity="0.9" stroke="#1F2430" stroke-width="1.6"/><path d="M16 211Q32 210.6 48 211Q48.4 219 48 227Q32 226.9 16 227Q16 219 16 211Z" fill="#8AC926" fill-opacity="0.9" stroke="#1F2430" stroke-width="1.6"/><path d="M16 230Q32 230 48 230Q48.3 238 48 246Q32 246.3 16 246Q15.7 238 16 230Z" fill="#2EC4B6" fill-opacity="0.9" stroke="#1F2430" stroke-width="1.6"/><path d="M16 249Q32 248.7 48 249Q47.9 257 48 265Q32 265.2 16 265Q16 257 16 249Z" fill="#FF8C42" fill-opacity="0.9" stroke="#1F2430" stroke-width="1.6"/></g><g stroke="none" fill="#1F2430" font-family="Archivo, 'Segoe UI', system-ui, sans-serif"><text x="16" y="22" font-size="15" font-weight="700">Madurez: de dibujar a integrar</text><text x="28" y="134.2" font-size="12" font-weight="700" text-anchor="middle">0</text><text x="59" y="96" font-size="11" font-weight="700" text-anchor="middle">dibujos 2D</text><text x="59" y="109" font-size="11" text-anchor="middle">sueltos</text><text x="120" y="114.2" font-size="12" font-weight="700" text-anchor="middle">1</text><text x="151" y="76" font-size="11" font-weight="700" text-anchor="middle">modelos 3D</text><text x="151" y="89" font-size="11" text-anchor="middle">con datos</text><text x="212" y="94.2" font-size="12" font-weight="700" text-anchor="middle">2</text><text x="243" y="56" font-size="11" font-weight="700" text-anchor="middle">colaboración</text><text x="243" y="69" font-size="11" text-anchor="middle">entre equipos</text><text x="304" y="74.2" font-size="12" font-weight="700" text-anchor="middle">3</text><text x="335" y="36" font-size="11" font-weight="700" text-anchor="middle">integrado</text><text x="335" y="49" font-size="11" text-anchor="middle">todo el ciclo</text><text x="16" y="164" font-size="