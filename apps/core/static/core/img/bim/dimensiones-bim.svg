="0.45"/></g><g fill="currentColor" stroke="none" font-family="Archivo, system-ui, sans-serif"><text x="200" y="22" font-size="13" font-weight="700" text-anchor="middle">Madurez: de dibujar a integrar</text><text x="62" y="126" font-size="10.5" font-weight="600" text-anchor="middle">0 · dibujos 2D</text><text x="154" y="126" font-size="10.5" font-weight="600" text-anchor="middle">1 · modelos 3D</text><text x="246" y="126" font-size="10.5" font-weight="600" text-anchor="middle">2 · colaboración</text><text x="338" y="126" font-size="10.5" font-weight="600" text-anchor="middle">3 · integrado</text><text x="200" y="160" font-size="12" font-weight="700" text-anchor="middle">Dimensiones: cada una suma una pregunta al modelo</text><text x="46" y="214" font-size="15" font-weight="700" text-anchor="middle">3D</text><text x="46" y="256" font-size="10.5" font-weight="600" text-anchor="middle">forma</text><text x="123" y="214" font-size="15" font-weight="700" text-anchor="middle">4D</text><text x="123" y="256" font-size="10.5" font-weight="600" text-anchor="middle">tiempo</text><text x="200" y="214" font-size="15" font-weight="700" text-anchor="middle">5D</text><text x="200" y="256" font-size="10.5" font-weight="600" text-anchor="middle">costo</text><text x="277" y="214" font-size="15" font-weight="700" text-anchor="middle">6D</text><text x="277" y="256" font-size="10.5" font-weight="600" text-anchor="middle">sostenibilidad</text><text x="354" y="214" font-size="15" font-weight="700" text-anchor="middle">7D</text><text x="354" y="256" font-size="10.5" font-weight="600" text-anchor="middle">operación</text><text x="200" y="284" font-size="10.5" font-weight="400" text-anchor="middle">Más dimensiones solo valen si el dato de abajo es confiable.</text></g></svg>