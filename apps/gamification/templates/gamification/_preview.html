<div class="av-card" style="--accent:{{ card.accent }}">
  <div class="av-big"><span class="av-idle">{{ big|safe }}</span></div>
  <div class="av-who">
    <p class="av-disc">{{ card.discipline }}</p>
    <p class="av-name">{{ card.name }}</p>
    <ul class="av-bonus" aria-label="Bonos de la carrera">{% for b in card.bonus %}<li title="{{ b.name }}"><b>{{ b.code }}</b> +{{ b.value }}</li>{% endfor %}</ul>
  </div>
</div>
<figure class="av-head"><span class="px">{{ bust|safe }}</span><figcaption>Así se ve en la cabecera</figcaption></figure>
