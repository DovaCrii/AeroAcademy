<label class="av-opt{% if opt.locked %} locked{% endif %}{% if opt.rec %} rec{% endif %}">
  <input type="radio" name="{{ group.key }}" value="{{ opt.id }}"{% if opt.selected %} checked{% endif %}{% if opt.locked %} disabled{% endif %} data-label="{{ opt.label }}">
  {% if group.tiles %}
  <span class="tile"><span class="px">{{ opt.svg|safe }}</span></span>
  {% else %}
  <span class="sw" style="background:{{ opt.color }}"></span>
  {% endif %}
  <span class="vh">{{ opt.tip }}</span>
  {% if group.key == "frame" %}<b class="swl" aria-hidden="true">{{ opt.label }}</b>{% else %}<span class="av-tip" aria-hidden="true">{{ opt.tip }}</span>{% endif %}
  {% if opt.rec %}<i class="rec-dot" aria-hidden="true"></i>{% endif %}
  {% if opt.locked %}<svg class="lock" viewBox="0 0 8 8" width="12" height="12" shape-rendering="crispEdges" aria-hidden="true" focusable="false"><path fill="var(--ink)" d="M2 0h4v1h1v2h-1v-2h-4v2h-1v-2h1zM1 3h6v5h-6z"/><path fill="var(--sheet)" d="M3 5h2v2h-2z"/></svg>{% endif %}
</label>
