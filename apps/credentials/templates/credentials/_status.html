{% if cred.status == "verified" %}<span class="chip ok">✔ Verificada</span>{% elif cred.status == "pending" %}<span class="chip pend">⧗ En revisión</span>{% else %}<span class="chip warn">✖ Rechazada</span>{% endif %}
{% if cred.is_expired %}<span class="chip warn">Vencida</span>{% elif cred.expires_soon %}<span class="chip pend">Vence en {{ cred.days_to_expiry }} días</span>{% endif %}
{% if cred.visibility == "private" %}<span class="chip">Privada</span>{% endif %}
